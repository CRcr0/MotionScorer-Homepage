<main class="story"><section class="act active" data-scene="0" data-mother="background-proof" style="--act-h:1180vh"></section><section class="act" data-scene="1" data-mother="scenario-world" style="--act-h:610vh"></section><section class="act" data-scene="2" data-mother="scenario-vlm" style="--act-h:760vh"></section><section class="act" data-scene="3" data-mother="score-attention" style="--act-h:880vh"></section><section class="act" data-scene="4" data-mother="filter-workbench" style="--act-h:1620vh"></section><section class="act" data-scene="5" data-mother="readout-selection" style="--act-h:1160vh"></section><section class="act" data-scene="6" data-mother="latent-geometry" style="--act-h:2500vh"></section><section class="act" data-scene="7" data-mother="training-evidence" style="--act-h:1480vh"></section></main><script id="story-spec" type="application/json">[{"chapterZh": "00 · Background：表示与出口", "chapterEn": "00 · Background: representation versus outlet", "mother": "background-proof", "height": "1180vh", "beats": [{"titleZh": "背景先固定：同一个场景、同一条候选轨迹", "titleEn": "Background first: one scene and one candidate trajectory", "ledeZh": "这是一段独立的 background 证明链。场景、候选轨迹、行人与驾驶指令从开头到结尾都不换；我们只比较规则、语义解释、隐藏表示与数字出口。", "ledeEn": "This is a self-contained background proof chain. The scene, candidate trajectory, pedestrian, and command never change; only rules, semantic rationale, hidden representation, and numeric outlet are compared.", "readZh": "红色候选轨迹横向切出并靠近行人；绿色轨迹是保持车道的参照。右上 BEV 与主视图共享同一车辆和轨迹身份。", "readEn": "The red candidate moves laterally near the pedestrian; the green path is the keep-lane reference. The BEV and main view share the same vehicle and trajectory identities.", "whyZh": "先固定输入，后面才能把差异归因于“读法”而不是暗中更换了样本。", "whyEn": "Fixing the input first lets later differences be attributed to the readout rather than to a silently changed example.", "kidZh": "像把同一道题钉在黑板上，接下来只换不同的阅卷出口。", "kidEn": "Like pinning one problem to the board and changing only the grading outlet.", "boundaryZh": "驾驶画面是贯穿全片的教学性 running example；论文结论来自系统实验。", "boundaryEn": "The driving scene is a running pedagogical example; the paper’s conclusions come from systematic experiments.", "math": "fixed (x, τ) throughout the background", "level": "SCHEMATIC RUNNING EXAMPLE", "source": "MotionScorer draft · Sec. 1 / Fig. 1"}, {"titleZh": "规则项目可以全部通过，人类仍然反对整体行为", "titleEn": "All listed rules can pass while humans still reject the behavior", "ledeZh": "碰撞、可行域、信号灯与舒适度灯依次变绿，但人类偏好仍选择保持车道：固定规则只认识预先写入的维度。", "ledeEn": "Collision, drivable-area, traffic-light, and comfort lamps turn green, yet human preference still chooses keeping lane: fixed rules recognize only prewritten dimensions.", "readZh": "上方场景完全不动；下方规则灯与 human preference 尺同时保留，让冲突发生在同一输入上。", "readEn": "The scene above stays unchanged; rule lamps and the human-preference ruler remain together so the conflict is attached to one input.", "whyZh": "这建立了为什么需要语义 Critic，但并不说明 VLM 的数字出口天然可靠。", "whyEn": "This motivates a semantic critic but does not imply that a VLM’s numeric outlet is naturally reliable.", "kidZh": "像作文清单四项都打勾，整篇文章仍可能不通顺。", "kidEn": "Like checking four rubric boxes while the essay remains incoherent.", "boundaryZh": "这是研究动机，不是“所有规则系统必然失败”的普遍定理。", "boundaryEn": "This is a research motivation, not a theorem that every rule system must fail.", "math": "rules pass  ≠  complete semantic quality", "level": "EMPIRICAL MOTIVATION", "source": "MotionScorer draft · Sec. 1; App. I.7.2"}, {"titleZh": "同一个冻结 VLM 已经能说出正确的语义理由", "titleEn": "The same frozen VLM can already state the right semantic reasons", "ledeZh": "聚光圈落在无必要横移、行人距离与缺少收益的位置，VLM 的解释指出了真正相关的场景证据。", "ledeEn": "Spotlights land on needless lateral motion, pedestrian distance, and lack of benefit; the VLM rationale identifies relevant scene evidence.", "readZh": "解释框仍连接上方同一条轨迹；这些短语之后会变成可追踪的文字位置。", "readEn": "The rationale box remains connected to the same trajectory; these phrases later become traceable text positions.", "whyZh": "这为“质量判断可能已经存进表示”提供直观动机，但仍需要 probe 实验正式定位。", "whyEn": "This motivates the possibility that quality judgment is already stored in the representation, but a probe experiment is still required to locate it.", "kidZh": "像学生已经能解释为什么这步棋不好，只是还没有稳定报分。", "kidEn": "Like a student who can explain why a move is poor but cannot yet report a stable score.", "boundaryZh": "自然语言解释本身不证明 representation premise；下一步的 frozen probe 才是诊断。", "boundaryEn": "A rationale alone does not prove the representation premise; the frozen probe is the diagnostic.", "math": "semantic rationale available from frozen Φ", "level": "EMPIRICAL MOTIVATION", "source": "MotionScorer draft · O1 / App. C(a)"}, {"titleZh": "解释保持合理，原生数字却挤进少数圆整槽位", "titleEn": "The rationale remains sensible while native numbers crowd into round bins", "ledeZh": "同一场景、同一冻结模型和同一隐藏状态保持；只有 native scalar decoding 被打开。输出在少数圆整数值间跳动，提示改写也留下明显聚集。", "ledeEn": "The same scene, frozen model, and hidden states remain; only native scalar decoding is opened. Outputs jump among a few round values, and prompt paraphrases retain the clustering.", "readZh": "左侧语义框不消失，右侧 score wheel 与直方图只表现“报告通道”。", "readEn": "The semantic rationale stays visible on the left; the score wheel and histogram on the right represent only the reporting channel.", "whyZh": "“模型知道”与“模型能稳定输出连续标量”因此必须分开评价。", "whyEn": "“The model knows” and “the model can reliably emit a continuous scalar” must therefore be evaluated separately.", "kidZh": "像脑中知道完整答案，口头作答却只能从几个固定数字中选。", "kidEn": "Like knowing the full answer but being allowed to speak only a few fixed numbers.", "boundaryZh": "round-bin 形状是教学性示意；真实 aggregate 证据稍后用 effective levels 与 prompt sensitivity 给出。", "boundaryEn": "The round-bin shape is schematic; later aggregate evidence reports effective levels and prompt sensitivity.", "math": "native score outlet: few effective levels", "level": "EMPIRICAL PREMISE", "source": "MotionScorer draft · O2 / App. C(b); Fig. 4"}, {"titleZh": "沿同一场景进入冻结 hidden-state cloud", "titleEn": "Follow the same scene into the frozen hidden-state cloud", "ledeZh": "道路画面收进上半区；下半区从同一个 Φ 展开一批 preferred / dispreferred hidden states。每个点仍对应一个场景–轨迹样本。", "ledeEn": "The road view docks above; below, the same Φ unfolds a population of preferred and dispreferred hidden states. Each point still corresponds to a scene–trajectory sample.", "readZh": "上方输入通过连线进入下方点云；没有重新抽取另一批与场景无关的点。", "readEn": "Connectors carry the upper input into the lower cloud; no unrelated point set is substituted.", "whyZh": "这一层开始回答“信息是否已经存进 frozen representation”。", "whyEn": "This layer begins to answer whether the information is already stored in the frozen representation.", "kidZh": "像把同一批答卷送进仓库，看仓库里的卡片能不能分开好坏。", "kidEn": "Like sending the same answers into a warehouse and checking whether its cards separate good from bad.", "boundaryZh": "点云是教学性三维投影；probe 的相对结论必须由论文 App. C 的固定协议支持。", "boundaryEn": "The cloud is a pedagogical 3D projection; the relative probe conclusion must be supported by the fixed App. C protocol.", "math": "H(x,τ) → frozen diagnostic population", "level": "EMPIRICAL DIAGNOSTIC", "source": "MotionScorer draft · App. C(a)"}, {"titleZh": "外部 probe plane 从同一朵 cloud 中找到可读方向", "titleEn": "An external probe plane finds an accessible direction in the same cloud", "ledeZh": "一张轻量 probe 平面旋入点云并分开两类样本；规则与 native outlet 的相对读出仍保留在下方。probe 只估计 representation ceiling，不参与部署。", "ledeEn": "A lightweight probe plane rotates into the cloud and separates the two classes; relative rule/native readouts remain below. The probe estimates the representation ceiling and is not deployed.", "readZh": "看三件事：点云不换、probe plane 新增、下方相对条只表达“明显高于”而不伪造论文未报告的百分比。", "readEn": "Read three things: the cloud is unchanged, only the probe plane is added, and the relative bars say “clearly higher” without inventing an unreported percentage.", "whyZh": "若 probe 不能明显超过规则与 prompting，整篇“representation 有而 outlet 读不出”的 framing 必须撤回。", "whyEn": "If the probe does not clearly exceed rules and prompting, the entire representation-versus-outlet framing must be withdrawn.", "kidZh": "像仓库里货物已经分好区，但正门的传送带仍把它们混在一起。", "kidEn": "Like goods already separated in a warehouse while the front conveyor still mixes them.", "boundaryZh": "这是 empirical premise 与 kill switch；图中的 plane 与相对 bar 不应被解读为部署模块或精确百分比。", "boundaryEn": "This is an empirical premise with a kill switch; the plane and relative bars are not deployment modules or exact percentages.", "math": "probe ceiling  >  native / rule readout", "level": "EMPIRICAL PREMISE", "source": "MotionScorer draft · App. C(a); Claim registry"}, {"titleZh": "同一批样本同时展示：信息存储 ≠ 信息报告", "titleEn": "The same samples show: information stored ≠ information reported", "ledeZh": "左侧保留 probe cloud；右侧把同一批 sample IDs 投到 native score bins。连续的表示差异在数字出口被压缩，二者不是两批不同数据。", "ledeEn": "The left retains the probe cloud; the right maps the same sample IDs into native score bins. Continuous representational differences are compressed at the numeric outlet; the two sides are not different datasets.", "readZh": "选中的点以细线连接到右侧对应 bin；左边能分开的邻近样本，右边可能落入同一圆整数值。", "readEn": "Selected points connect by thin lines to their corresponding bins; samples separated on the left may land in the same round value on the right.", "whyZh": "这一受控对照把故障定位在 readout channel，而不是 hidden representation 本身。", "whyEn": "This controlled comparison localizes the failure to the readout channel rather than the hidden representation itself.", "kidZh": "像不同颜色的文件在仓库中分得很清楚，出口却只盖四种印章。", "kidEn": "Like clearly separated colored files in a warehouse receiving only four kinds of exit stamp.", "boundaryZh": "若 prompt/decoding controls 能关闭 probe gap，这一结论必须缩窄到具体 decoding 配置。", "boundaryEn": "If prompt or decoding controls close the probe gap, this conclusion must be narrowed to the specific decoding configuration.", "math": "stored information  ≠  native reported scalar", "level": "EMPIRICAL PREMISE", "source": "MotionScorer draft · O1–O2 / App. C(a,b)"}, {"titleZh": "把 background 结论收成一枚 premise：现在研究“怎样读”", "titleEn": "Dock the background conclusion into one premise: now study how to read", "ledeZh": "background 内部的场景、点云、probe 与 bins 收回一张 premise 卡：质量判断已经存在，但原生数值通道没有可靠暴露它。主故事从这里重新展开方法。", "ledeEn": "The background scene, cloud, probe, and bins retract into one premise card: quality judgment is present, but the native numeric channel does not reliably expose it. The method story opens from here.", "readZh": "终态只保留“judgment present / outlet limited”与同一驾驶场景的小型锚点。", "readEn": "The terminal state retains only “judgment present / outlet limited” and a small anchor of the same driving scene.", "whyZh": "独立 background 与方法主线的连接点由此清楚标注，而不是假装所有对象必须无缝变形。", "whyEn": "This explicitly marks the connection between the independent background and the method story rather than pretending every object must morph continuously.", "kidZh": "像先完成一页诊断报告，再把结论贴到下一页实验台上。", "kidEn": "Like finishing a diagnostic report and pinning its conclusion above the next workbench.", "boundaryZh": "这是章节级桥接；background 证据仍受前述 falsification conditions 约束。", "boundaryEn": "This is a chapter-level bridge; the background evidence remains subject to the stated falsification conditions.", "math": "premise: judgment present; native outlet limited", "level": "BACKGROUND BRIDGE", "source": "MotionScorer draft · Sec. 1 / App. C"}], "handoffIn": "background-scene", "handoffOut": "diagnostic-premise"}, {"chapterZh": "01 · 从诊断到 readout 问题", "chapterEn": "01 · From diagnosis to the readout question", "mother": "scenario-world", "height": "610vh", "beats": [{"titleZh": "带着 background premise 回到同一个驾驶场景", "titleEn": "Return to the same driving scene with the background premise attached", "ledeZh": "场景没有重新设计；左上 premise badge 只提醒我们已经建立的诊断：信息在表示中，问题是怎样通过 frozen interface 读出来。", "ledeEn": "The scene is not redesigned; the premise badge only recalls the diagnosis already established: information is in the representation, and the question is how to read it through the frozen interface.", "readZh": "道路、候选轨迹、行人与指令都与 background 相同；新增的只有一枚 premise badge。", "readEn": "Road, candidate trajectory, pedestrian, and command are the same as in the background; only a premise badge is added.", "whyZh": "主故事不再重复证明“信息存在”，而是转向可实现 readout。", "whyEn": "The main story no longer re-proves that information exists; it turns to realizable readout.", "kidZh": "像诊断已经完成，现在开始设计不会拆开机器的读卡器。", "kidEn": "Like finishing the diagnosis and now designing a reader without opening the machine.", "boundaryZh": "premise 是经验前提，不应在方法动画中被升级为架构定理。", "boundaryEn": "The premise is empirical and must not be upgraded into an architectural theorem by the method animation.", "math": "same (x,τ), frozen Φ, premise fixed", "level": "CONTINUITY BRIDGE", "source": "MotionScorer draft · O1–O2"}, {"titleZh": "已有路线分别改出口、回到规则，或重写模型", "titleEn": "Prior routes alter the outlet, return authority to rules, or rewrite the model", "ledeZh": "同一场景下并排出现 direct prompting、rule gating 与 weight modification。它们各自解决部分问题，却没有同时满足冻结 backbone、绝对标量与语义证据。", "ledeEn": "Direct prompting, rule gating, and weight modification appear beside the same scene. Each solves part of the problem but not all of frozen backbone, absolute scalar, and semantic evidence.", "readZh": "三张路线卡都从同一个场景出发；没有为不同方法更换输入。", "readEn": "All three route cards originate from the same scene; the input is not changed across methods.", "whyZh": "这把 MotionScorer 的问题定位成接口设计，而不是再造一个新的 scene-understanding model。", "whyEn": "This positions MotionScorer as interface design rather than another scene-understanding model.", "kidZh": "像同一台收音机：可以反复喊话、交给旧规则打分，或拆机改电路；我们寻找第四种方式。", "kidEn": "Like one radio: shout repeatedly, hand it to an old rule sheet, or rewire it; we seek a fourth route.", "boundaryZh": "路线对照是高层分类；具体能力边界以论文 Table 1 与匹配实验为准。", "boundaryEn": "The route comparison is high-level; exact capability boundaries follow Table 1 and matched experiments.", "math": "prompt | rule gate | weight update", "level": "PROBLEM FRAMING", "source": "MotionScorer draft · Fig. 1 / Table 1"}, {"titleZh": "冻结 Φ：能否读取，而不是安装评分能力？", "titleEn": "Freeze Φ: can scoring ability be read out rather than installed?", "ledeZh": "所有旧出口退暗，冻结 VLM 锁定。核心问题只剩：通过模型自己的 causal attention interface，能恢复多少已经可解码的质量信息？", "ledeEn": "Prior outlets dim and the VLM is locked. The remaining question is how much decodable quality information can be recovered through the model’s own causal attention interface.", "readZh": "画面中心只保留 Φ❄、一个 shared reader 占位与 scalar score 问号。", "readEn": "The center retains Φ❄, a shared-reader placeholder, and a scalar-score question mark.", "whyZh": "这把“是否含有信息”与“接口能够实现哪种读法”分成两个 ceiling。", "whyEn": "This separates whether information exists from which readings the interface can realize.", "kidZh": "像仓库有货之后，还要确认门和传送带能不能把货送出来。", "kidEn": "Like confirming not only that a warehouse has goods but also that its door and conveyor can deliver them.", "boundaryZh": "方法最终受 representation ceiling 与 realizability ceiling 双重限制。", "boundaryEn": "The method is ultimately limited by both representation and realizability ceilings.", "math": "How much can a frozen native interface read out?", "level": "CORE QUESTION", "source": "MotionScorer draft · Sec. 1 / App. O"}, {"titleZh": "不换场景：把它收进上半区，开始逐层打开 VLM", "titleEn": "Do not change the scene: dock it above and open the VLM layer by layer", "ledeZh": "完整道路画面缩入上半区左侧；轨迹、行人与指令仍是同一组对象。下半区将打开“模型怎样把它们变成可读取位置”。", "ledeEn": "The full road view docks in the upper-left region; trajectory, pedestrian, and command remain the same objects. The lower region opens how the model turns them into readable positions.", "readZh": "看动画终态：上方不是一张新缩略图，而是刚才场景的同一份状态。", "readEn": "At the terminal state, the upper view is not a new thumbnail but the same scene state just examined.", "whyZh": "从这里开始，每一层细节都从上方对应对象打开，并在讲完后收回原对象。", "whyEn": "From here onward, each detail opens from its matching upper object and closes back into that same object.", "kidZh": "像在地图上保留整座城市，同时把一个街区放到下方放大。", "kidEn": "Like keeping the whole city map above while magnifying one neighborhood below.", "boundaryZh": "这是叙事连续性设计；它不新增论文中的科学主张。", "boundaryEn": "This is a narrative-continuity design and adds no scientific claim to the paper.", "math": "scenario → frozen VLM", "level": "CONTINUITY BRIDGE", "source": "Interactive-story continuity contract"}], "handoffIn": "diagnostic-premise", "handoffOut": "scenario-docked"}, {"chapterZh": "02 · 场景进入冻结 VLM", "chapterEn": "02 · The scene enters the frozen VLM", "mother": "scenario-vlm", "height": "760vh", "beats": [{"titleZh": "上方场景保持；下方拆成四类输入", "titleEn": "Keep the scene above; split it into four input families below", "ledeZh": "相机/BEV、候选轨迹、自车状态与驾驶指令从同一场景向下展开。它们是一个 multimodal context 的不同位置，不是四个模型。", "ledeEn": "Camera/BEV, candidate trajectory, ego state, and driving command unfold from the same scene. They are position families in one multimodal context, not four models.", "readZh": "每张卡都用连线回指上方的道路、轨迹或指令，避免出现无来源的 token。", "readEn": "Each card keeps a connector back to the road, trajectory, or command above, so no token appears without a source.", "whyZh": "先知道每个位置来自哪里，后面才能问“最后的 score query 到底在读哪里”。", "whyEn": "Only after locating every position can we ask where the final score query actually reads.", "kidZh": "像把一段录像拆成图像卡、路线卡、速度卡和任务卡。", "kidEn": "Like splitting one video into image, route, speed, and instruction cards.", "boundaryZh": "分组是教学性可视化；真实系统使用固定 vision patches、tokenizer 与 multimodal processor。", "boundaryEn": "The grouping is pedagogical; the real system uses its fixed vision patches, tokenizer, and multimodal processor.", "math": "context = {image, trajectory, ego, command/text}", "level": "EXACT SETUP", "source": "MotionScorer draft · Sec. 3; App. I.3"}, {"titleZh": "四类输入首尾相接，组成一条 context 序列", "titleEn": "The four input families join into one context sequence", "ledeZh": "图像 patch、轨迹采样点、ego 数值与文字片段沿同一时间线排开；位置身份会一路保留到 attention 与 filter。", "ledeEn": "Image patches, trajectory samples, ego values, and text fragments line up on one sequence; position identity remains visible through attention and filtering.", "readZh": "下方长条不是一句纯文字，而是 multimodal positions 的统一索引。", "readEn": "The lower strip is not a purely textual sentence; it is a shared index over multimodal positions.", "whyZh": "论文的滤波式对“位置”求和，因此位置来源必须在画面中可追踪。", "whyEn": "The paper’s filtering equation sums over positions, so the origin of every position must remain traceable.", "kidZh": "像把不同颜色的证据卡按编号装进同一个文件夹。", "kidEn": "Like filing differently colored evidence cards into one numbered folder.", "boundaryZh": "候选名称或颜色不能暗中编码优劣；论文输入协议明确避免使用候选顺序标识。", "boundaryEn": "Candidate names or colors must not secretly encode quality; the paper’s input protocol excludes candidate-order identifiers.", "math": "C(x,τ) = ordered multimodal context positions", "level": "EXACT SETUP", "source": "MotionScorer draft · App. I.3"}, {"titleZh": "整条 context 经过同一个被冻结的 VLM", "titleEn": "The entire context passes through one frozen VLM", "ledeZh": "视觉编码器、multimodal projector、语言模型、attention projections 与原始输出层都被冰蓝外壳锁住。", "ledeEn": "The vision encoder, multimodal projector, language model, attention projections, and original output layers are locked inside the frozen shell.", "readZh": "输入卡进入同一块 Φ，输出成为一排 contextual states；没有任何 backbone 参数发热。", "readEn": "The input cards enter the same Φ and become contextual states; no backbone parameter becomes trainable.", "whyZh": "这把“读出能力”与“重新训练理解能力”隔离开。", "whyEn": "This isolates learning a readout from relearning semantic understanding.", "kidZh": "像给整台机器贴封条，只允许在末端接一个小读卡器。", "kidEn": "Like sealing the whole machine and allowing only a small reader at the end.", "boundaryZh": "冻结边界必须由参数 checksum 与原任务能力检查审计，而不能只靠图上的雪花。", "boundaryEn": "The frozen boundary must be audited by parameter checksums and original-task checks, not merely by a snowflake icon.", "math": "every parameter of Φ fixed", "level": "EXACT ARCHITECTURE", "source": "MotionScorer draft · App. B / App. I.1"}, {"titleZh": "原 context states 在追加查询前后保持不变", "titleEn": "Original context states remain unchanged after queries are appended", "ledeZh": "下方两排 state checksum 完全重合；追加发生在 causal 序列尾部，因此新查询可以读取前文，却不能回写已经形成的 context states。", "ledeEn": "The two rows of state checksums coincide. Appending occurs at the end of a causal sequence, so new queries may read the past but cannot rewrite existing context states.", "readZh": "看两排小方块：追加前与追加后逐格相同，变化只会发生在新追加的位置。", "readEn": "Read the two rows of squares: every original position is identical before and after appending; change occurs only at new positions.", "whyZh": "这是真正支撑“backbone unchanged”的结构原因。", "whyEn": "This is the structural reason the backbone remains unchanged.", "kidZh": "像坐在最后一排的学生能看见前面板书，却不能改掉老师已经写好的字。", "kidEn": "Like a student in the last row who can see the board but cannot alter what the teacher already wrote.", "boundaryZh": "该结论依赖 causal masking 的实际实现；双向 attention 架构不能自动套用。", "boundaryEn": "The conclusion depends on the actual causal mask; it does not automatically transfer to bidirectional attention architectures.", "math": "context states before = context states after append", "level": "EXACT ARCHITECTURE", "source": "MotionScorer draft · Eq. 2 setup; Table 7 claim registry"}, {"titleZh": "只在尾部追加共享 query bank 与一个 [score] query", "titleEn": "Append only a shared query bank and one [score] query at the tail", "ledeZh": "蓝色查询卡 E=(e₁,…,e_K,e_s) 滑到 context 后面。它们共享于整个数据分布，不会针对每个驾驶场景临时重新设计。", "ledeEn": "Blue query cards E=(e₁,…,e_K,e_s) slide behind the context. They are shared across the data distribution rather than redesigned per driving scene.", "readZh": "辅助 queries 与最后的 [score] query 同属一套共享 bank；下一章只放大最后一个 query 的 context attention。", "readEn": "Auxiliary queries and the final [score] query belong to one shared bank; the next chapter magnifies only the final query’s context attention.", "whyZh": "共享 E 把问题从“逐场景自由写 taps”变成“训练一种全局阅读习惯”。", "whyEn": "Shared E turns per-scene free tap design into learning one distribution-wide reading habit.", "kidZh": "像全班共用同一套读题方法，而不是每道题临时发明一套符号。", "kidEn": "Like a class sharing one reading strategy rather than inventing a new notation for every question.", "boundaryZh": "只有 E 与 scalar head ω 可训练；E 参数化可实现 attention patterns，但并不等于直接存储 taps。", "boundaryEn": "Only E and scalar head ω are trainable; E parameterizes realizable attention patterns but does not directly store the taps.", "math": "trainable = {E, ω};  Φ frozen", "level": "EXACT CONSTRAINT", "source": "MotionScorer draft · Sec. 3; Proposition 1"}], "handoffIn": "scenario-docked", "handoffOut": "query-bank"}, {"chapterZh": "03 · 最后的 [score] query 怎样看前文", "chapterEn": "03 · How the final [score] query reads the context", "mother": "score-attention", "height": "880vh", "beats": [{"titleZh": "保留上方场景与 VLM，只放大尾部查询", "titleEn": "Retain the scene and VLM above; magnify only the trailing query", "ledeZh": "上半区继续显示场景→冻结 Φ；下半区把完整 context 与追加查询铺开。当前唯一的新对象是最后的 [score] query。", "ledeEn": "The upper region keeps scene→frozen Φ; the lower region lays out the context and appended queries. The only new focal object is the final [score] query.", "readZh": "蓝色辅助 query 仍在，但紫色 [score] 被高亮；它将产生用于标量报告的 state，并提供精确 filtering branch。", "readEn": "Blue auxiliary queries remain, while purple [score] is highlighted; it produces the state used for scalar reporting and the exact filtering branch.", "whyZh": "“last token attention”必须落到具体的 trailing score query，而不是泛指任意最后一个语言 token。", "whyEn": "“Last-token attention” must refer to the specific trailing score query, not any arbitrary final language token.", "kidZh": "像把镜头从整台收音机推到最后一个调音旋钮。", "kidEn": "Like pushing the camera from the whole radio to its final tuning knob.", "boundaryZh": "完整 score-query state h_s 不等同于线性 filter；精确滤波对象只是一条 context-attention contribution。", "boundaryEn": "The complete score-query state h_s is not a linear filter; the exact filtering object is only its context-attention contribution.", "math": "context … e₁ … e_K  [score]", "level": "EXACT SETUP", "source": "MotionScorer draft · Sec. 3 / Eq. 2–3"}, {"titleZh": "把论文 Figure 2 的文字位置原样放进序列", "titleEn": "Place the readable text positions from Figure 2 directly into the sequence", "ledeZh": "Lane、Change、Congestion、Unnecessary、Follower、Brake、Road、Red 依次出现，最后接 [score]。图像、轨迹与 ego positions 仍以折叠组保留在左侧。", "ledeEn": "Lane, Change, Congestion, Unnecessary, Follower, Brake, Road, and Red appear in order, followed by [score]. Image, trajectory, and ego positions remain as collapsed groups on the left.", "readZh": "这些英文词就是论文 Figure 2 使用的可读 token-position 示例；中文小字只提供语义 gloss。", "readEn": "These English words are the readable token-position examples used in Figure 2; the Chinese sublabels are semantic glosses only.", "whyZh": "观众现在能具体看到“tap 读了哪个词”，而不是面对八根无名柱子。", "whyEn": "The audience can now see which word each tap reads instead of facing eight anonymous bars.", "kidZh": "像把音轨从 1–8 改名为 Lane、Change、Unnecessary……每个旋钮终于有对象。", "kidEn": "Like renaming tracks 1–8 as Lane, Change, Unnecessary… so every knob finally has an object.", "boundaryZh": "这些是图中的 human-readable positions，不宣称等同于真实 tokenizer 的完整 BPE 切分；完整 C 仍包含多模态位置。", "boundaryEn": "These are human-readable positions from the figure, not a claim about the exact full BPE segmentation; the full C still contains multimodal positions.", "math": "Lane · Change · Congestion · Unnecessary · Follower · Brake · Road · Red · [score]", "level": "FIGURE-ALIGNED VIEW", "source": "MotionScorer draft · Fig. 2"}, {"titleZh": "因果 mask：查询看得见前文，前文看不见未来查询", "titleEn": "Causal mask: the query sees the past; the past does not see future queries", "ledeZh": "下方矩阵最后一行点亮所有 context 列，而原 context 行仍保持 causal 下三角。所以上方场景表示不会因追加 query 被重写。", "ledeEn": "The final matrix row lights all context columns, while original context rows retain the causal lower triangle. Thus the scene representation above is not rewritten by the appended query.", "readZh": "亮格表示可读取关系；最后一行连接 Lane…Red，前面的行不会连接未来 [score]。", "readEn": "Bright cells denote readable relations; the last row connects to Lane…Red, while earlier rows do not connect to future [score].", "whyZh": "访问全部证据与保护原状态，在同一个 mask 结构中同时成立。", "whyEn": "Access to all evidence and protection of original states hold simultaneously in the same mask structure.", "kidZh": "像最后一排学生能读完整份讲义，但讲义中的前几页不会因为他读了而改变。", "kidEn": "Like a student on the last page who can read the full handout while earlier pages remain unchanged.", "boundaryZh": "精确性依赖 causal sequence 与实现审计；图中的小矩阵是结构示意，不是实际模型尺寸。", "boundaryEn": "Exactness depends on the causal sequence and implementation audit; the small matrix is structural, not the model’s actual size.", "math": "appended query may attend to all preceding context", "level": "EXACT ARCHITECTURE", "source": "MotionScorer draft · Sec. 3; App. I.1"}, {"titleZh": "[score] 先与每个位置比较，得到一排 logits", "titleEn": "[score] first compares with every position to produce logits", "ledeZh": "q_s 与各 context key k_i 的缩放点积沿同一坐标轴长成柱子。Unnecessary、Follower 等质量相关位置较高，Red 等位置也可能因 shortcut 获得响应。", "ledeEn": "Scaled dot products between q_s and context keys k_i grow into bars on one axis. Quality-relevant positions such as Unnecessary and Follower rise, while positions such as Red may also respond through shortcuts.", "readZh": "弧线仍回到对应 token；柱高与弧线强度由同一组 logit 数据驱动。", "readEn": "Every arc still returns to its token; bar height and arc strength are driven by the same logits.", "whyZh": "logit 只是未归一化的相关程度，还不是合法的 filter tap。", "whyEn": "A logit is only an unnormalized relevance score, not yet a valid filter tap.", "kidZh": "像先给每张证据卡打“相关程度草分”。", "kidEn": "Like assigning each evidence card a rough relevance score.", "boundaryZh": "画面 logits 是确定性教学样本；论文没有公布逐 token 的真实注意力数值。", "boundaryEn": "The displayed logits are deterministic teaching values; the paper does not publish the real per-token attention values.", "math": "s_i = q_sᵀk_i / √d", "level": "STANDARD ATTENTION STEP", "source": "MotionScorer draft · Sec. 3 attention decomposition"}, {"titleZh": "softmax 把 logits 变成非负、总和为 1 的 taps", "titleEn": "Softmax turns logits into nonnegative taps summing to one", "ledeZh": "蓝色注意力弧与下方竖杆同步更新；证据读法把质量集中在 Unnecessary、Follower、Brake，shortcut 读法则可能偏向 Red 或固定位置。", "ledeEn": "Blue attention arcs and lower rods update together. The evidence reader concentrates on Unnecessary, Follower, and Brake, while a shortcut may favor Red or a fixed position.", "readZh": "看 [score] 发出的弧：线越粗，对应位置在加权和中的份额越大。", "readEn": "Read the arcs leaving [score]: thicker lines give the corresponding position a larger share in the weighted sum.", "whyZh": "从这一刻起，抽象 α_i 已经有了可见对象与具体文字。", "whyEn": "From this moment onward, abstract α_i has a visible object and a concrete word.", "kidZh": "像把草分换算成总重量正好 100% 的注意力蛋糕。", "kidEn": "Like turning rough scores into an attention pie whose total weight is exactly 100%.", "boundaryZh": "单纯形约束是精确的；“应该给哪个 token 更高权重”仍是需要训练与实验决定的问题。", "boundaryEn": "The simplex constraint is exact; which token deserves more weight remains a learning and empirical question.", "math": "α_i ≥ 0,  Σ_i α_i = 1", "level": "EXACT ATTENTION STEP", "source": "MotionScorer draft · Eq. 2 / Table 7"}, {"titleZh": "同一排 token 向下展开，成为三维 filter 的横轴", "titleEn": "The same token row unfolds downward into the 3D filter’s x-axis", "ledeZh": "上方 Lane…Red 与下方 x 轴逐一用虚线连接；下一章不重新命名位置，只增加每个位置在多个 latent channel 上的贡献波形。", "ledeEn": "Lane…Red above connect one-to-one to the lower x-axis with dashed lines. The next chapter does not rename positions; it only adds their contribution waveforms across latent channels.", "readZh": "终态中 token 顺序、attention taps 与下方 3D 坐标完全对齐。", "readEn": "At the terminal state, token order, attention taps, and the lower 3D coordinates are fully aligned.", "whyZh": "这就是从 last-score attention 到 filtering 的真正继承，而不是切到一张新图。", "whyEn": "This is genuine inheritance from last-score attention to filtering rather than a cut to an unrelated diagram.", "kidZh": "像把桌面上的八张卡沿垂线放到八个音轨位置。", "kidEn": "Like lowering eight cards vertically onto eight audio-track positions.", "boundaryZh": "三维波形仍是高维 value contributions 的教学投影；token identity 与加权聚合关系则来自论文 Figure 2 与 Eq. 2。", "boundaryEn": "The 3D waves remain a pedagogical projection of high-dimensional value contributions; token identity and weighted aggregation come from Figure 2 and Eq. 2.", "math": "token positions → multi-channel contributions", "level": "CONTINUITY BRIDGE", "source": "MotionScorer draft · Fig. 2 / Eq. 2"}], "handoffIn": "query-bank", "handoffOut": "token-filter-axis"}, {"chapterZh": "04 · 3D filtering 与可实现读法", "chapterEn": "04 · 3D filtering and realizable readings", "mother": "filter-workbench", "height": "1620vh", "beats": [{"titleZh": "同一排文字位置长成多层 latent 波形", "titleEn": "The same text positions grow into layered latent waveforms", "ledeZh": "横向仍是 Lane…Red；纵向表示对读出的贡献强度；纵深表示不同 latent channel。上方场景、VLM 与 [score] attention 全部保留。", "ledeEn": "The horizontal axis remains Lane…Red; vertical height shows contribution to the readout; depth indexes latent channels. Scene, VLM, and [score] attention all remain above.", "readZh": "每个上方 token 都有虚线落到下方同名位置；绿色、红色、灰色波形只增加 channel 维度。", "readEn": "Every upper token drops a dashed connector to the same named position below; green, red, and gray waves only add the channel dimension.", "whyZh": "观众因此能同时回答“这个波来自哪个词”和“它在哪个 latent channel 中出现”。", "whyEn": "The audience can simultaneously answer which word a wave comes from and in which latent channel it appears.", "kidZh": "像同一首歌的歌词位置不变，只把人声、鼓声与噪声分成多条立体音轨。", "kidEn": "Like keeping lyric positions fixed while separating voice, drums, and noise into layered tracks.", "boundaryZh": "波形是教学性一维投影，不代表模型内部真的存在六条物理信号线。", "boundaryEn": "The waveforms are pedagogical 1D projections, not literal physical signal wires inside the model.", "math": "position contribution = quality + nuisance", "level": "MODEL VIEW", "source": "MotionScorer draft · Fig. 2 / Eq. 7"}, {"titleZh": "质量证据跨 channel 保持共同形状，干扰各自乱跳", "titleEn": "Quality evidence keeps a common shape across channels while nuisance jitters", "ledeZh": "绿色波在 Unnecessary、Follower、Brake 附近跨深度同相出现；红色格式 shortcut 与灰色其他语义具有不同相位和局部峰值。", "ledeEn": "Green waves appear coherently across depth near Unnecessary, Follower, and Brake; red formatting shortcuts and gray semantics have different phases and local peaks.", "readZh": "先比较不同深度中的形状是否一致，不要只找最高的一根峰。", "readEn": "Compare shape consistency across depth before chasing the single tallest peak.", "whyZh": "“有用信号强”并不等于“某一个 token 振幅最大”；稳定结构可以分布在多个位置。", "whyEn": "“Strong useful signal” does not mean one token has the largest amplitude; stable structure may be distributed across positions.", "kidZh": "像多支麦克风都听到同一句人声，而空调噪声在每支麦克风中乱得不同。", "kidEn": "Like several microphones hearing the same voice while air-conditioner noise differs across microphones.", "boundaryZh": "signal+nuisance decomposition 是论文的模型假设；必须由 held-out correlation 与 permutation controls 支持。", "boundaryEn": "The signal+nuisance decomposition is the paper’s model assumption and must be supported by held-out correlation and permutation controls.", "math": "wᵀW_Ov_i = quality_i + nuisance_i", "level": "MODEL ASSUMPTION", "source": "MotionScorer draft · Eq. 7; Table 7 claim registry"}, {"titleZh": "上方 attention taps 原位落到每个文字位置", "titleEn": "The upper attention taps land on the same text positions", "ledeZh": "蓝色竖杆的粗细与上方 [score] attention 弧线完全同步。所有权重归一化后共同决定每个 position 的贡献份额。", "ledeEn": "Blue rod thickness is synchronized with the [score] attention arcs above. Normalized weights jointly determine every position’s contribution share.", "readZh": "沿 Unnecessary 的垂线向上看，可以同时看到 token、attention arc、tap rod 与波形。", "readEn": "Follow the vertical line above Unnecessary to see the token, attention arc, tap rod, and waveform together.", "whyZh": "filter 不再是孤立比喻：它直接继承自最后 score query 对相同 positions 的注意力。", "whyEn": "The filter is no longer an isolated metaphor; it directly inherits the final score query’s attention over the same positions.", "kidZh": "像每条立体音轨上方都有一个由同一调音台控制的音量推子。", "kidEn": "Like every 3D track having a volume fader controlled by the same console.", "boundaryZh": "精确身份只覆盖 score query 的 context-attention contribution；完整 h_s 还包含残差与其他分支。", "boundaryEn": "The exact identity covers only the score query’s context-attention contribution; full h_s still contains residual and other branches.", "math": "o_E^(r) = Σ_i α_i^(r) v_i^(r)", "level": "EXACT ARCHITECTURE", "source": "MotionScorer draft · Eq. 2 / Sec. 3"}, {"titleZh": "加权波形穿过紫色 filter plane，汇成一个 output", "titleEn": "Weighted waves pass through the purple filter plane and merge into one output", "ledeZh": "每个 token/channel 的 α_i v_i 沿同色轨迹流向滤波面；右侧绿色球表示保留的质量分量，红色外圈表示残余干扰。", "ledeEn": "Each token/channel contribution α_i v_i flows to the plane along a matching color; the green orb shows retained quality and the red ring shows residual nuisance.", "readZh": "线宽、tap 高度与流入滤波面的贡献由同一 α 数组驱动。", "readEn": "Line width, tap height, and contribution entering the plane are driven by the same α array.", "whyZh": "这一步把“最后一个 query 的注意力”变成了可测量的 filtered latent。", "whyEn": "This step turns the final query’s attention into a measurable filtered latent.", "kidZh": "像固定音轨乘上各自音量后，在混音台中合成一条输出。", "kidEn": "Like multiplying fixed tracks by their volumes and mixing them into one output.", "boundaryZh": "精确的线性求和发生在 context-attention branch；最终 scalar report 仍从完整 score-query state 读取。", "boundaryEn": "The exact linear sum occurs in the context-attention branch; the final scalar report still reads the full score-query state.", "math": "z_E = Σ_r W_O^(r) o_E^(r)", "level": "EXACT ARCHITECTURE", "source": "MotionScorer draft · Eq. 2–3"}, {"titleZh": "论文中的 readout distribution 也从同一 token 轴生成", "titleEn": "The paper’s readout distribution also grows from the same token axis", "ledeZh": "右侧小面板逐行保留 Lane…Red，并对比 plain query 与 nuGuidance 后的 readout emphasis；Unnecessary 等质量位置获得更清楚的质量分布。", "ledeEn": "The small right panel retains Lane…Red row by row and contrasts plain-query versus nuGuidance readout emphasis; quality positions such as Unnecessary receive clearer distributions.", "readZh": "虚线是 before，紫色实线是 after；行名与左侧 x 轴一一对应。", "readEn": "Dashed curves are before and solid purple curves are after; every row name matches the x-axis on the left.", "whyZh": "这让“filter 改变了怎样读取”不仅体现在一个球上，也体现在各 token 的读出分布上。", "whyEn": "This shows the changed reading not only in one orb but also in the per-token readout distributions.", "kidZh": "像不仅听最终混音，还检查每条歌词位置在混音前后的声音分布。", "kidEn": "Like listening to the final mix while also inspecting each lyric position before and after mixing.", "boundaryZh": "该小面板复现 Figure 2 的结构性示意，不把其中曲线当作论文实验表中的定量结果。", "boundaryEn": "The small panel recreates Figure 2’s structural illustration and does not treat its curves as quantitative experiment results.", "math": "before (plain query)  →  after nuGuidance", "level": "FIGURE-ALIGNED VIEW", "source": "MotionScorer draft · Fig. 2"}, {"titleZh": "离线 pseudo score 给出“什么变化才算质量变化”", "titleEn": "The offline pseudo score tells the filter what variation counts as quality", "ledeZh": "橙色 y*=42 卡片沿用论文 Figure 2 的示意数值，指向 shared query 的更新路径；它不在推理时进入模型。", "ledeEn": "The orange y*=42 card reuses the schematic value from Figure 2 and points to the shared-query update path; it does not enter inference.", "readZh": "橙色监督只告诉系统哪种 batch variation 随分数变化，不直接指定每一根 tap。", "readEn": "Orange supervision tells the system which batch variation follows score, but does not directly assign every tap.", "whyZh": "自动目标解决“要预测什么”，还没有解决在可实现族中“应该怎么读”。", "whyEn": "The automatic target solves what to predict but not yet how to read within the realizable family.", "kidZh": "像老师给出成绩变化，却不替学生逐字划出所有重点。", "kidEn": "Like a teacher providing score changes without highlighting every word for the student.", "boundaryZh": "y*=42 是论文图中的 schematic example，不是某个公开实验样本的已核验真实分数。", "boundaryEn": "y*=42 is the schematic example in the paper figure, not a verified score from a specific public sample.", "math": "offline pseudo score y*", "level": "SCHEMATIC SUPERVISION", "source": "MotionScorer draft · Fig. 2; App. I.2"}, {"titleZh": "经典自由 filter 可以独立拧每一个 tap", "titleEn": "A classical free filter can turn every tap independently", "ledeZh": "金色 ghost 在上方打开一排互不联动的旋钮：若 signal template 与 nuisance covariance 已知，经典解先白化干扰，再对齐 signal。", "ledeEn": "A gold ghost opens a row of independent knobs above: if the signal template and nuisance covariance were known, the classical solution would whiten nuisance and align with signal.", "readZh": "金色 taps 与蓝色 taps 使用同一 token 位置，但控制自由度不同。", "readEn": "Gold taps and blue taps share the same token positions but have different control freedom.", "whyZh": "经典公式提供方向感，却不是 MotionScorer 可以直接写入 frozen attention 的算法。", "whyEn": "The classical formula provides a reference direction but is not an update MotionScorer can directly write into frozen attention.", "kidZh": "像理想录音棚允许单独拧八个旋钮，真实设备却只有厂家暴露的一只总手柄。", "kidEn": "Like an ideal studio with eight independent knobs while the real device exposes only one shared handle.", "boundaryZh": "θ、Σ 在 frozen nonlinear front end 后不可观测；free optimum 仅是 reference solution。", "boundaryEn": "θ and Σ are unobserved behind the frozen nonlinear front end; the free optimum is only a reference solution.", "math": "α_free* ∝ Σ⁻¹θ", "level": "CLASSICAL REFERENCE", "source": "MotionScorer draft · Eq. 4; App. C.1"}, {"titleZh": "冻结模型只有一个共享 query 手柄，所有 taps 联动", "titleEn": "The frozen model has one shared query handle, so all taps move together", "ledeZh": "蓝色手柄沿可达轨道移动时，Lane…Red 上方的所有 taps 同步改变；它不能逐场景跳到金色 free optimum。", "ledeEn": "As the blue handle moves along its reachable rail, all taps above Lane…Red change together; it cannot jump per scene to the gold free optimum.", "readZh": "观察手柄与每根 tap 的虚线连杆：一个 E 同时控制整个 attention pattern。", "readEn": "Observe the dashed linkages from the handle to every tap: one E controls the entire attention pattern.", "whyZh": "可实现性本身是一种结构约束：学习只能在 frozen Φ 暴露的接口里发生。", "whyEn": "Realizability is itself a structural constraint: learning can occur only through the interface exposed by frozen Φ.", "kidZh": "像八个窗帘共用一根拉绳，拉一次所有窗帘按固定机械关系移动。", "kidEn": "Like eight curtains sharing one cord, so one pull moves them all through a fixed mechanism.", "boundaryZh": "A_Φ 是高维、输入相关的 readout family；画面轨道是可解释的低维投影。", "boundaryEn": "A_Φ is a high-dimensional, input-dependent readout family; the displayed rail is an interpretable low-dimensional projection.", "math": "α_Φ(E;x,τ) ∈ A_Φ(x,τ)", "level": "EXACT CONSTRAINT", "source": "MotionScorer draft · Eq. 5; Proposition 1"}, {"titleZh": "训练不改波场，只把共享手柄推向证据读法", "titleEn": "Training does not rewrite the waves; it moves the shared handle toward an evidence readout", "ledeZh": "冻结 value waves、场景与 Φ 全部保持；只有蓝色手柄、attention pattern 与小型 scalar head 更新。绿色质量输出增强，红色残余干扰下降。", "ledeEn": "Frozen value waves, scene, and Φ remain fixed; only the blue handle, attention pattern, and small scalar head update. Green quality output strengthens while red residual nuisance falls.", "readZh": "对比运动前后：底层波形一像素不换，变化只出现在 taps 与 output。", "readEn": "Compare before and after: the underlying waves do not change; only taps and output move.", "whyZh": "论文的新视角不是“再教一遍语义理解”，而是“在已有证据上训练一种更稳的读法”。", "whyEn": "The paper’s new view is not to reteach semantic understanding but to train a more stable reading of existing evidence.", "kidZh": "像录音不重录，只训练调音师把人声从背景噪声中读出来。", "kidEn": "Like keeping the recording fixed and training the engineer to recover the voice from noise.", "boundaryZh": "该动画表达方法机制；它不声称 learned attention 唯一或达到 classical global optimum。", "boundaryEn": "The animation expresses the method mechanism; it does not claim learned attention is unique or reaches the classical global optimum.", "math": "train only E and ω; keep Φ fixed", "level": "METHOD", "source": "MotionScorer draft · Sec. 4 / Fig. 7"}, {"titleZh": "共享 query 手柄向右打开可实现 readout family AΦ", "titleEn": "The shared query handle opens the realizable readout family AΦ", "ledeZh": "上方 hierarchy 与左侧 3D filter 保持；右侧只打开 shared E 能够诱导的 attention-pattern family。family 中每个点都与左侧一套 taps 同步。", "ledeEn": "The upper hierarchy and left 3D filter remain; the right opens only the family of attention patterns induced by shared E. Every point in the family synchronizes with one tap pattern on the left.", "readZh": "移动右侧当前点，左侧 Lane…Red taps、加权波形与 filtered output 同时变化。", "readEn": "Move the current point on the right and the left Lane…Red taps, weighted waves, and filtered output change together.", "whyZh": "AΦ 因而不是一块孤立的抽象区域，而是同一个 3D filter 的控制空间。", "whyEn": "AΦ is therefore not an isolated abstract blob but the control space of the same 3D filter.", "kidZh": "像只有一只共享机械手柄：手柄位置决定八个旋钮一起落在哪里。", "kidEn": "Like one shared mechanical handle whose position determines all eight knobs together.", "boundaryZh": "右侧是高维 realizable family 的教学性二维投影；可实现约束与共享 E 则是精确架构结论。", "boundaryEn": "The right side is a pedagogical 2D projection of a high-dimensional family; the realizability constraint and shared E are exact architectural claims.", "math": "AΦ(x,τ) = { αΦ(E;x,τ) : E∈ℰ }", "level": "EXACT CONSTRAINT + CONCEPTUAL PROJECTION", "source": "MotionScorer draft · Eq. 5 / Proposition 1"}, {"titleZh": "经典 free-tap optimum 作为金色参照出现，但可能在 AΦ 之外", "titleEn": "The classical free-tap optimum appears as a gold reference and may lie outside AΦ", "ledeZh": "左侧经典旋钮可以逐 tap 自由设置；右侧金色星表示 α*free。冻结模型只能沿蓝色 realizable region 移动，不能直接跳到星标。", "ledeEn": "The classical knobs can be set independently; the gold star denotes α*free. The frozen model can move only inside the blue realizable region and cannot jump directly to the star.", "readZh": "金色虚线只表示 reference gap；左侧 shared-handle taps 仍由当前 AΦ 点生成。", "readEn": "The gold dashed line indicates only a reference gap; the left shared-handle taps are still generated by the current AΦ point.", "whyZh": "经典闭式解在这里提供方向直觉，而不是可直接执行的 update。", "whyEn": "The classical closed form provides directional intuition here, not a directly executable update.", "kidZh": "像参考答案写着八个旋钮各自该拧多少，但机器只给你一个联动手柄。", "kidEn": "Like an answer key specifying eight independent knobs when the machine gives you one coupled handle.", "boundaryZh": "α*free 只有在落入冻结接口的 image AΦ 时才可实现；故事不会把 reference 画成 method output。", "boundaryEn": "α*free is executable only if it lies in the frozen interface image AΦ; the story never depicts the reference as the method output.", "math": "α*free ∝ Σ⁻¹θ  · reference only", "level": "CLASSICAL REFERENCE", "source": "MotionScorer draft · Eq. 4–5; App. C.1"}, {"titleZh": "优化路径始终留在 AΦ 内，并与左侧 taps 同步", "titleEn": "The optimization path stays inside AΦ and remains synchronized with the taps", "ledeZh": "初始化点沿蓝色路径移动到更偏向质量证据的区域。每一步都由同一个 shared E 产生，左侧 filter output 与清晰度同步更新。", "ledeEn": "The initialization moves along a blue path toward a region emphasizing quality evidence. Every step is produced by the same shared E, and the left filtered output and clarity update synchronously.", "readZh": "路径不会穿出边界，也不会逐样本重新起点；终点是 distribution-level readout。", "readEn": "The path never leaves the boundary or restarts per example; its endpoint is a distribution-level readout.", "whyZh": "这正是 constrained filtering 与普通自由滤波器的关键差别。", "whyEn": "This is the key difference between constrained filtering and a free classical filter.", "kidZh": "像在围栏内推动一个联动手柄，不能穿墙，也不能每道题换一台机器。", "kidEn": "Like moving a coupled handle inside a fence: it cannot pass through walls or swap machines for each problem.", "boundaryZh": "优化路径是 conceptual projection；“同一 E 在分布上共享、所有可达 taps 属于 AΦ”是精确命题。", "boundaryEn": "The path is a conceptual projection; “one E is shared over the distribution and all reachable taps lie in AΦ” is exact.", "math": "E* = arg min_E 𝔼_(x,τ)~D [ L(x,τ;E) ]", "level": "EXACT CONSTRAINT + SCHEMATIC PATH", "source": "MotionScorer draft · Eq. 5 / Proposition 1"}], "handoffIn": "token-filter-axis", "handoffOut": "selected-readout"}, {"chapterZh": "05 · 同样拟合，不代表读法一样", "chapterEn": "05 · Same fit does not mean the same reading", "mother": "readout-selection", "height": "1160vh", "beats": [{"titleZh": "上方完整 filter 保留；下方从同一 wave field 打开两套读法", "titleEn": "Retain the full filter above; open two readings from the same wave field below", "ledeZh": "质量波、干扰波、冻结 Φ 与 pseudo-score 数据完全相同。下方绿色 evidence reader 与红色 shortcut reader 只有 taps 不同。", "ledeEn": "Quality waves, nuisance waves, frozen Φ, and pseudo-score data are identical. Only the taps differ between the green evidence reader and red shortcut reader below.", "readZh": "两套读法都由同一 shared-query interface 实现，不是换了两个 backbone。", "readEn": "Both readings are realized through the same shared-query interface; no second backbone is introduced.", "whyZh": "这是一个受控比较：把“读法”从模型、数据和容量中单独隔离出来。", "whyEn": "This controlled comparison isolates the reading strategy from model, data, and capacity.", "kidZh": "像同一段录音交给两位调音师，只比较他们怎样推旋钮。", "kidEn": "Like giving one recording to two engineers and comparing only their fader settings.", "boundaryZh": "绿色/红色标签是解释性名称；真正的 causal support 来自后面的 attention intervention 实验。", "boundaryEn": "The green/red labels are interpretive names; causal support comes from the attention-intervention experiments.", "math": "same frozen representation, different readouts", "level": "CONTROLLED COMPARISON", "source": "MotionScorer draft · O3 / Sec. 4.2"}, {"titleZh": "两套 taps 明显不同：一套读证据，一套抓 shortcut", "titleEn": "The tap patterns differ: one reads evidence, the other grabs a shortcut", "ledeZh": "绿色读法把质量集中在 Unnecessary、Follower、Brake；红色读法把大量权重放在固定格式位置或 Red。冻结波场完全相同。", "ledeEn": "The green reader concentrates on Unnecessary, Follower, and Brake; the red reader places much of its mass on a fixed formatting position or Red. The frozen wave field is identical.", "readZh": "两排 tap stems 使用同一 Lane…Red 轴，便于逐位置比较；差异发生在内部 reading，而不是 input。", "readEn": "The two tap rows share the same Lane…Red axis for positionwise comparison; the difference lies in internal reading, not input.", "whyZh": "只看最后一个数字会隐藏这种内部差异。", "whyEn": "Looking only at the final number hides this internal difference.", "kidZh": "像两名学生都答对：一个读题意，另一个只记住答案总在右下角。", "kidEn": "Like two students both answering correctly: one reads the problem, the other memorizes that the answer is usually in the lower-right corner.", "boundaryZh": "tap patterns 是教学性示例；“matched endpoint fit 可由不同 attention readouts 实现”是论文的经验前提。", "boundaryEn": "The tap patterns are pedagogical; the existence of different attention readouts at matched endpoint fit is an empirical premise.", "math": "αΦ(E₁) ≠ αΦ(E₂)", "level": "EMPIRICAL PREMISE", "source": "MotionScorer draft · O3 / Sec. 4.2 / App. C(c)"}, {"titleZh": "不同 scalar heads 可以补偿内部差异，使训练答案接近", "titleEn": "Different scalar heads can compensate internal differences and match training answers", "ledeZh": "两套 filtered outputs 先不同，再经过各自 affine head gain 落到同一个 pseudo-score target 附近。endpoint loss 只看到最后结果。", "ledeEn": "The two filtered outputs differ before their affine heads map them near the same pseudo-score target. Endpoint loss sees only the final results.", "readZh": "绿色与红色内部 orb 不重合，但右侧 final-score markers 几乎重合。", "readEn": "The green and red internal orbs differ, while their final-score markers nearly overlap.", "whyZh": "这解释了为什么“拟合 teacher”还没有指定内部应该怎样读。", "whyEn": "This explains why fitting the teacher does not yet specify how the model should read internally.", "kidZh": "像两种不同的计算过程，最后都被换算器调成同一个答案。", "kidEn": "Like two different calculations adjusted by converters to the same answer.", "boundaryZh": "head compensation 是 underdetermination 的机制解释；具体 divergence 需要 matched-fit seeds 与 held-out 测试支持。", "boundaryEn": "Head compensation explains the mechanism of underdetermination; actual divergence requires matched-fit seeds and held-out testing.", "math": "g_ω₁(h_s¹) ≈ g_ω₂(h_s²) ≈ y*", "level": "MECHANISM + EMPIRICAL PREMISE", "source": "MotionScorer draft · Sec. 4.2; App. C(c)"}, {"titleZh": "从两套实际 filter 打开同一个 equal-loss valley", "titleEn": "Open one equal-loss valley from the two actual filters", "ledeZh": "左侧保留两套 readout；右侧展开 query/readout 与 head-compensation 的教学性投影。低损失区域是一条细长谷地，而不是唯一点。", "ledeEn": "The two readouts remain on the left; the right unfolds a pedagogical projection of query/readout and head compensation. The low-loss region is an elongated valley rather than one point.", "readZh": "绿色与红色解在 valley 内各有位置，并通过连线回到左侧对应 taps。", "readEn": "Green and red solutions occupy different points in the valley and connect back to their corresponding taps on the left.", "whyZh": "这个空间把“同一训练答案，多种内部实现”变成可见对象。", "whyEn": "This space makes “one training answer, multiple internal implementations” visible.", "kidZh": "像山谷底有一整条平路，站在不同位置都处于相近海拔。", "kidEn": "Like a long flat path along a valley floor: many locations have nearly the same elevation.", "boundaryZh": "valley 是 conceptual projection，不声称真实参数空间只有二维；matched-fit 数值来自论文 Table 3。", "boundaryEn": "The valley is a conceptual projection, not a claim that the true parameter space is 2D; matched-fit numbers come from Table 3.", "math": "low L_score does not uniquely identify (E,ω)", "level": "CONCEPTUAL PROJECTION", "source": "MotionScorer draft · O3 / Table 3"}, {"titleZh": "两个 valley 解的 pseudo fit 几乎相同，内部读法仍不同", "titleEn": "Two valley solutions have nearly identical pseudo fit but different internal readings", "ledeZh": "绿色与红色解分别标出；下方显示 pseudo-val RMSE 0.095 与 0.096，差异远小于 held-out human generalization 的差异。", "ledeEn": "Green and red solutions are marked; pseudo-validation RMSE values 0.095 and 0.096 are shown below, far closer than their held-out human-generalization results.", "readZh": "数值 meter 与 valley 点、tap pattern 绑定，不是三张独立图。", "readEn": "The numeric meters are bound to the valley points and tap patterns rather than presented as three unrelated figures.", "whyZh": "endpoint fit 的近似相同使后面的 generalization 分叉能真正归因于 readout selection。", "whyEn": "Near-identical endpoint fit lets the later generalization divergence be attributed to readout selection.", "kidZh": "像两名学生平时成绩几乎一样，长尾题才暴露谁真正理解。", "kidEn": "Like two students with nearly identical routine scores whose understanding is revealed by long-tail questions.", "boundaryZh": "matched-fit 需同时控制 query count、head、初始化、预算、checkpoint rule 与 seeds；论文 App. I.6 明确规定。", "boundaryEn": "Matched fit also controls query count, head, initialization, budget, checkpoint rule, and seeds, as specified in App. I.6.", "math": "|RMSE_ours−RMSE_plain| small  ∧  |SRCC_ours−SRCC_plain| small", "level": "MATCHED-FIT EVIDENCE", "source": "MotionScorer draft · Table 3 / App. I.6"}, {"titleZh": "现在只移动红灰 nuisance；绿色质量 evidence 保持不动", "titleEn": "Now move only red/gray nuisance; keep green quality evidence fixed", "ledeZh": "格式位置与无关语义重新排相；场景语义、quality component、query、head 与训练预算都不重训。", "ledeEn": "Formatting positions and irrelevant semantics rephase; scene semantics, quality component, query, head, and training budget are not retrained.", "readZh": "上方绿色波保持相同，只有红灰波逐渐改变相位和振幅。", "readEn": "The green wave above stays fixed while only red and gray waves change phase and amplitude.", "whyZh": "这把“分布偏移”变成可见的单变量干预。", "whyEn": "This turns distribution shift into a visible single-variable intervention.", "kidZh": "像人声不变，只换了教室里的回声与空调噪声。", "kidEn": "Like keeping the voice fixed while changing room echo and air-conditioner noise.", "boundaryZh": "该 shift 是机制教学控制，不是论文某个具体数据集样本的逐 token 重放。", "boundaryEn": "The shift is a mechanism-level teaching control, not a per-token replay of a specific dataset sample.", "math": "quality fixed · nuisance shifted", "level": "SCHEMATIC CONTROL", "source": "MotionScorer draft · O3 intuition / registered prediction"}, {"titleZh": "shortcut 输出随干扰漂移，证据读法仍保持稳定", "titleEn": "The shortcut output drifts with nuisance while the evidence reading remains stable", "ledeZh": "下方两条输出轨迹开始分叉：绿色跟随跨 channel 的质量形状，红色则跟着 Red/固定位置 shortcut 抖动。", "ledeEn": "The two output traces fork: green follows the cross-channel quality shape, while red jitters with the Red/fixed-position shortcut.", "readZh": "query、head 与模型此时保持冻结；分叉是原先 readout choice 的后果。", "readEn": "Queries, head, and model are frozen here; the fork is a consequence of the earlier readout choice.", "whyZh": "同样的 teacher fit 可以隐藏完全不同的 held-out 泛化。", "whyEn": "The same teacher fit can hide very different held-out generalization.", "kidZh": "像平时考试都满分，换一种题目版式才看出谁真正理解。", "kidEn": "Like two students acing familiar exams until a new layout reveals who understood.", "boundaryZh": "若 matched-fit readouts 不在 held-out/long-tail 上分叉，TCD 的选择动机就必须撤回或降级。", "boundaryEn": "If matched-fit readouts do not diverge on held-out/long-tail data, the motivation for TCD must be withdrawn or downgraded.", "math": "matched teacher fit  ≠  matched held-out behavior", "level": "EMPIRICAL PREMISE", "source": "MotionScorer draft · App. C(c) falsification condition"}, {"titleZh": "score loss 规定答什么；TCD 选择怎样读", "titleEn": "Score loss specifies what to answer; TCD selects how to read", "ledeZh": "绿色读法的“质量变化² / 残余干扰”更高。金色选择信号作用于 filtered latent，再把梯度沿 z_E→E 送回共享 query 手柄。", "ledeEn": "The green reading has a larger quality-variation-squared to residual-nuisance ratio. The gold selection signal acts on the filtered latent and returns gradient along z_E→E to the shared query handle.", "readZh": "金色箭头不会直接抓住某一根 tap；它只能通过共享 E 间接改变所有 taps。", "readEn": "The gold arrow never grabs an individual tap directly; it can change all taps only indirectly through shared E.", "whyZh": "两个目标对象不同：L_score 约束 endpoint，ρ_TCD 选择内部读法。", "whyEn": "The objectives act on different objects: L_score constrains the endpoint, while ρ_TCD selects the internal reading.", "kidZh": "像老师既给正确答案，又要求使用能迁移到新题的解题方法。", "kidEn": "Like a teacher providing the correct answer while requiring a solution method that transfers to new problems.", "boundaryZh": "TCD 不保证 attention 唯一或人类对齐；它提出一个可证伪的 selection principle。", "boundaryEn": "TCD does not guarantee unique attention or human alignment; it proposes a falsifiable selection principle.", "math": "L_score: what  |  ρ_TCD: how", "level": "METHOD", "source": "MotionScorer draft · Sec. 4.2–4.3"}], "handoffIn": "selected-readout", "handoffOut": "filtered-latent-orb"}, {"chapterZh": "06 · TCD latent laboratory", "chapterEn": "06 · TCD latent laboratory", "mother": "latent-geometry", "height": "2500vh", "beats": [{"titleZh": "不换对象：filtered z_E orb 展开成同一 minibatch 的三维点", "titleEn": "Do not change objects: the filtered z_E orb unfolds into the same minibatch in 3D", "ledeZh": "上方 hierarchy 保留 Scenario→Φ→[score]→Filter→z_E。下方绿色 orb 分裂成 B 个样本点，每个点都来自同一 readout 对一个训练样本的 filtered latent。", "ledeEn": "The upper hierarchy retains Scenario→Φ→[score]→Filter→z_E. Below, the green orb splits into B sample points, each the filtered latent produced by the same readout for one training example.", "readZh": "点从 orb 中连续展开；sample identity 与后面所有 projection、residual、whitening 操作保持不变。", "readEn": "Points continuously unfold from the orb; sample identity remains fixed through projection, residual, and whitening operations.", "whyZh": "这样 latent lab 是 filter output 的放大，而不是突然出现的另一朵点云。", "whyEn": "The latent lab is therefore a magnification of the filtered output, not an unrelated cloud appearing suddenly.", "kidZh": "像把一个装有整班数据的盒子打开，里面每张卡都有固定编号。", "kidEn": "Like opening a box containing a whole class of data, with every card carrying a fixed ID.", "boundaryZh": "三维坐标是高维 z_E 的教学性投影；统计量由同一 canonical batch 计算。", "boundaryEn": "The 3D coordinates are a pedagogical projection of high-dimensional z_E; statistics are computed from one canonical batch.", "math": "{(z_b,y_b*)}_{b=1}^B", "level": "SCHEMATIC GEOMETRY + EXACT DATA FLOW", "source": "MotionScorer draft · Algorithm 1–2 / Fig. 3"}, {"titleZh": "给每个点绑定 pseudo score 颜色，而不是再加一套点", "titleEn": "Bind pseudo-score color to every point instead of adding another cloud", "ledeZh": "点的位置仍由 z_b 决定；颜色从低分红色连续过渡到高分绿色。右侧色尺与 sample IDs 同源。", "ledeEn": "Point position remains determined by z_b; color transitions continuously from low-score red to high-score green. The color scale shares the same sample IDs.", "readZh": "沿绿色方向移动时，颜色整体趋向高分；但此刻还没有估计该方向。", "readEn": "Colors tend to increase along a direction, but that direction has not yet been estimated.", "whyZh": "teacher score 在这里不是最终人工真值，而是用来定义“哪种 latent 变化与训练目标一致”。", "whyEn": "Here the teacher score is not final human truth; it defines which latent variation aligns with the training target.", "kidZh": "像给每个学生贴上当前分数，再观察座位图里分数怎样变化。", "kidEn": "Like labeling each student with a current score and observing how scores vary across the seating map.", "boundaryZh": "pseudo scores 来自一次性离线 rule-gated teacher；不使用 human ratings 进行训练或 model selection。", "boundaryEn": "Pseudo scores come from a one-time offline rule-gated teacher; human ratings are not used for training or model selection.", "math": "color(z_b) ← y_b*", "level": "SUPERVISION VIEW", "source": "MotionScorer draft · Sec. 4.1 / App. I.2"}, {"titleZh": "先中心化：整体平移到原点，点间关系不变", "titleEn": "Center first: translate the cloud to the origin without changing pairwise structure", "ledeZh": "均值 z̄ 与平均 pseudo score ȳ* 被计算出来；每个样本变为 z̃_b=z_b−z̄、ỹ_b=y_b*−ȳ*。", "ledeEn": "The mean z̄ and average pseudo score ȳ* are computed; every sample becomes z̃_b=z_b−z̄ and ỹ_b=y_b*−ȳ*.", "readZh": "灰色箭头显示整个 cloud 平移；点之间的相对形状不变。", "readEn": "Gray arrows show the cloud translation; relative shape among points remains unchanged.", "whyZh": "中心化把“共同偏置”与“分数相关变化”分开，是后续回归斜率的基准。", "whyEn": "Centering separates common offsets from score-related variation and provides the baseline for the regression slope.", "kidZh": "像先把全班平均分设为 0，再看每个人高于或低于平均多少。", "kidEn": "Like setting the class average to zero before measuring who is above or below it.", "boundaryZh": "这是 Algorithm 2 lines 1–2 的精确计算；动画只把高维平移投影到三维。", "boundaryEn": "This is the exact computation in Algorithm 2 lines 1–2; the animation only projects the high-dimensional translation into 3D.", "math": "z̃_b=z_b−z̄,  ỹ_b=y_b*−ȳ*", "level": "EXACT CRITERION STEP", "source": "MotionScorer draft · Algorithm 2 lines 1–2"}, {"titleZh": "从同一批点估计“分数升高时 latent 共同移动的方向”", "titleEn": "Estimate the direction in which the latent moves as the score increases", "ledeZh": "绿色箭头 ŝ_E 从 centered cloud 中生长。它是 latent 对 centered pseudo score 的最小二乘斜率。", "ledeEn": "The green vector ŝ_E grows from the centered cloud. It is the least-squares slope of latent coordinates on centered pseudo score.", "readZh": "箭头、右侧范数 meter 与公式中的同一 ŝ_E 同步；没有手调方向。", "readEn": "The arrow, norm meter, and formula share the same ŝ_E; no direction is hand-tuned.", "whyZh": "它回答的是“训练目标变化时，filtered latent 平均往哪里走”，而不是任意 PCA 方向。", "whyEn": "It answers where the filtered latent tends to move as the training target changes, not an arbitrary PCA direction.", "kidZh": "像在座位图上画一支箭头，指出分数通常沿哪个方向升高。", "kidEn": "Like drawing an arrow on a seating chart showing the direction in which scores tend to rise.", "boundaryZh": "ŝ_E 是 minibatch estimator；有限 batch bias 与 variance 在论文附录中单独记录。", "boundaryEn": "ŝ_E is a minibatch estimator; finite-batch bias and variance are separately documented in the appendix.", "math": "ŝ_E = (Σ_b ỹ_b z̃_b)/(Σ_b ỹ_b²+ε_s)", "level": "EXACT CRITERION STEP", "source": "MotionScorer draft · Algorithm 2 line 3"}, {"titleZh": "每个点先落到自己的 score-aligned component", "titleEn": "Each point first lands on its score-aligned component", "ledeZh": "对样本 b，绿色终点是 ŝ_E ỹ_b。高分与低分样本沿同一轴落在相反方向，长度由 ỹ_b 决定。", "ledeEn": "For sample b, the green endpoint is ŝ_E ỹ_b. High- and low-score samples fall on opposite sides of the same axis, with length set by ỹ_b.", "readZh": "先只高亮少数 exemplar points；其余点低亮度保留，避免一开始形成视觉毛球。", "readEn": "Only a few exemplar points are highlighted first; the rest remain dim to avoid an immediate visual hairball.", "whyZh": "这一拍把抽象乘积 ŝ_E ỹ_b 变成每个样本可见的 component。", "whyEn": "This beat turns the abstract product ŝ_E ỹ_b into a visible component for each sample.", "kidZh": "像按每个人高于平均分多少，把他放到同一条分数尺上。", "kidEn": "Like placing each student on one score ruler according to how far above or below average they are.", "boundaryZh": "score component 是 model decomposition 下的解释对象；它不声称捕获了所有 human-relevant quality structure。", "boundaryEn": "The score component is interpreted under the model decomposition; it need not capture all human-relevant quality structure.", "math": "score component_b = ŝ_E ỹ_b", "level": "MODEL-BASED DECOMPOSITION", "source": "MotionScorer draft · Eq. 7 / Algorithm 2 line 4"}, {"titleZh": "先用少数 exemplar 完整画出 z̃_b = ŝ_E ỹ_b + r_b", "titleEn": "Use a few exemplars to show the complete decomposition z̃_b = ŝ_E ỹ_b + r_b", "ledeZh": "绿色段从原点到 score component；红色段从 component 到真实 centered point。两段首尾相接，严格重构 z̃_b。", "ledeEn": "The green segment runs from the origin to the score component; the red segment runs from that component to the true centered point. Together they reconstruct z̃_b exactly.", "readZh": "同一个 exemplar 同时显示原点、component、residual 与最终点；颜色与公式逐项对应。", "readEn": "Each exemplar simultaneously shows origin, component, residual, and final point; colors match the formula term by term.", "whyZh": "观众先理解一条向量，再推广到整批，避免把很多线误认为随机噪声。", "whyEn": "The audience understands one vector before the construction expands to the batch, preventing the lines from looking like random noise.", "kidZh": "像先拆一支铅笔：绿色是沿分数尺的部分，红色是偏离这把尺的剩余。", "kidEn": "Like decomposing one pencil: green is the part along the score ruler, red is the remaining deviation.", "boundaryZh": "Eq. 7 的 signal+nuisance decomposition 是论文唯一的 model assumption，不是 architecture identity。", "boundaryEn": "The signal+nuisance decomposition in Eq. 7 is the paper’s sole model assumption, not an architectural identity.", "math": "z̃_b = ŝ_E ỹ_b + r_b", "level": "MODEL ASSUMPTION", "source": "MotionScorer draft · Eq. 7 / Claim registry"}, {"titleZh": "把同一分解推广到整个 minibatch，但已解释的线降低亮度", "titleEn": "Extend the same decomposition to the full minibatch while dimming already-explained lines", "ledeZh": "所有样本都获得绿色 score component 与红色 residual。exemplar 保持高亮，其余线以低透明度出现。", "ledeEn": "Every sample receives a green score component and red residual. Exemplars remain bright while all other lines appear with low opacity.", "readZh": "点、component 与 residual 都来自同一 canonical arrays；没有为视觉效果额外生成线。", "readEn": "Points, components, and residuals all come from the same canonical arrays; no extra lines are generated for appearance.", "whyZh": "全批展开让 residual covariance 真正有可见的数据来源。", "whyEn": "The full-batch construction gives the residual covariance a visible data source.", "kidZh": "像先教会一题，再把同一种拆法应用到全班答卷。", "kidEn": "Like teaching one example and then applying the same decomposition to the whole class.", "boundaryZh": "过多线条仅是投影拥挤；高维计算仍逐样本精确进行。", "boundaryEn": "Line crowding is only a projection artifact; the high-dimensional computation remains exact per sample.", "math": "∀b: r_b = z̃_b − ŝ_E ỹ_b", "level": "EXACT CRITERION STEP UNDER MODEL VIEW", "source": "MotionScorer draft · Algorithm 2 line 4"}, {"titleZh": "执行减法：每个点沿 residual 移动到新的 residual endpoint", "titleEn": "Execute the subtraction: each point moves to its residual endpoint", "ledeZh": "原始 centered point 退成 ghost；点沿红色 residual 轨迹移动到 r_b。sample ID 与颜色顺序都保持。", "ledeEn": "Original centered points fade into ghosts; each sample moves along its red residual trajectory to r_b. Sample IDs and ordering remain fixed.", "readZh": "移动起点是 z̃_b，终点是 r_b；不是重新随机采样一朵红色噪声云。", "readEn": "The motion starts at z̃_b and ends at r_b; no new random red noise cloud is sampled.", "whyZh": "这一步真正移除了由 pseudo score 线性解释的部分。", "whyEn": "This step actually removes the part linearly explained by pseudo score.", "kidZh": "像从每支箭头中剪掉沿分数尺的绿色段，只留下偏离部分。", "kidEn": "Like cutting away the green segment along the score ruler and keeping only the deviation.", "boundaryZh": "residual 被称为 nuisance 依赖 Eq. 7；它仍可能包含未建模的质量结构。", "boundaryEn": "Calling the residual nuisance depends on Eq. 7; it may still contain unmodeled quality structure.", "math": "r_b = z̃_b − ŝ_E ỹ_b", "level": "EXACT COMPUTATION + MODEL INTERPRETATION", "source": "MotionScorer draft · Algorithm 2 line 4"}, {"titleZh": "只留下同一批 residual points，score direction 作为低亮度参照", "titleEn": "Keep only the same residual points, with the score direction as a dim reference", "ledeZh": "绿色 component 收回，红色 residual endpoints 原位保留；原始 centered points 以低透明 ghost 留在背景。", "ledeEn": "Green components retract, red residual endpoints remain, and original centered points stay as low-opacity ghosts.", "readZh": "短虚线显示每个 sample 的移动来源；点的数量与 ID 没有变化。", "readEn": "Short dashed lines show where each sample came from; point count and IDs do not change.", "whyZh": "现在才有资格询问“这些未被分数解释的变化沿各坐标有多宽”。", "whyEn": "Only now can we ask how wide the unexplained variation is along each coordinate.", "kidZh": "像把共同趋势擦掉后，只看每个人偏离趋势线的部分。", "kidEn": "Like removing a common trend and inspecting each person’s deviation from it.", "boundaryZh": "图中红色只表示 residual，不表示每个 residual 必然有害。", "boundaryEn": "Red denotes residual here, not that every residual component is necessarily harmful.", "math": "residual cloud {r_b}", "level": "DERIVED OBJECT", "source": "MotionScorer draft · Algorithm 2 line 4"}, {"titleZh": "沿 z₁、z₂、z₃ 分别量 residual spread", "titleEn": "Measure residual spread separately along z₁, z₂, and z₃", "ledeZh": "三个 axis rulers 从 residual cloud 中读出 diagonal variances。每个 ruler 的长度直接来自同一批 r_b。", "ledeEn": "Three axis rulers read diagonal variances from the residual cloud. Each ruler’s length is computed directly from the same r_b samples.", "readZh": "右侧 D₁、D₂、D₃ meters 与点云沿对应轴的宽度同步。", "readEn": "The D₁, D₂, and D₃ meters synchronize with cloud width along their corresponding axes.", "whyZh": "先显示逐轴 variance，再让 ellipsoid 生长，避免椭球像无来源装饰。", "whyEn": "Showing axiswise variance before growing the ellipsoid prevents it from appearing decorative or source-free.", "kidZh": "像用三把互相垂直的尺子量一团棉花在三个方向上的厚度。", "kidEn": "Like measuring a cotton cloud’s thickness with three perpendicular rulers.", "boundaryZh": "主方法使用 diagonal covariance；cross-coordinate covariance 被作为可消融近似而非忽略不报。", "boundaryEn": "The main method uses diagonal covariance; cross-coordinate covariance is an ablated approximation rather than an unreported omission.", "math": "D̂_E = diag(B⁻¹Σ_b r_b⊙r_b)+ε_D I", "level": "EXACT CRITERION STEP", "source": "MotionScorer draft · Algorithm 2 line 5; App. D"}, {"titleZh": "axis-aligned nuisance ellipsoid 从同一组 D̂_E 生长", "titleEn": "An axis-aligned nuisance ellipsoid grows from the same D̂_E", "ledeZh": "椭球三个半轴由 √D̂₁、√D̂₂、√D̂₃ 决定，且与 latent basis 对齐。点云不换。", "ledeEn": "The three ellipsoid semiaxes are set by √D̂₁, √D̂₂, and √D̂₃ and remain aligned with the latent basis. The cloud does not change.", "readZh": "wire ellipsoid 与三个 variance meters 使用同一个 D̂_E 数组。", "readEn": "The wire ellipsoid and three variance meters use the same D̂_E array.", "whyZh": "它把“剩余干扰代价在不同方向不同”变成可见的空间宽度。", "whyEn": "It turns direction-dependent residual cost into visible spatial width.", "kidZh": "像同一团棉花在竖直方向很厚、横向较薄。", "kidEn": "Like one cotton cloud being thick vertically and thin horizontally.", "boundaryZh": "因为采用 diagonal D̂，主画面不会随意旋转椭球；full-covariance variant 才会包含旋转。", "boundaryEn": "Because D̂ is diagonal, the main visual does not arbitrarily rotate the ellipsoid; a full-covariance variant would.", "math": "nuisance width in direction w: √(wᵀD̂_Ew)", "level": "EXACT GEOMETRY OF DIAGONAL APPROXIMATION", "source": "MotionScorer draft · Eq. 9 / App. D"}, {"titleZh": "先放入一根任意读取方向 w，而不是直接跳到最优解", "titleEn": "Introduce an arbitrary reading direction w before jumping to the optimum", "ledeZh": "金色 ruler 从原点伸出。此时它只是候选方向，可能同时读到较少 signal 和较多 nuisance。", "ledeEn": "A gold ruler extends from the origin. It is only a candidate direction and may capture little signal while admitting much nuisance.", "readZh": "绿色 ŝ_E、红色 ellipsoid 与金色 w 同时保留，三者共享同一个坐标系。", "readEn": "Green ŝ_E, red ellipsoid, and gold w remain together in one coordinate system.", "whyZh": "只有先定义任意 w，deflection ratio 才能被理解为一个方向选择问题。", "whyEn": "Only after defining arbitrary w can the deflection ratio be understood as a direction-selection problem.", "kidZh": "像先随便把耳朵朝一个方向，再量听到的声音与噪声。", "kidEn": "Like first pointing an ear in an arbitrary direction and measuring voice and noise.", "boundaryZh": "w 是 criterion 内的 latent direction，不是 attention taps α。", "boundaryEn": "w is a latent direction inside the criterion, not the attention taps α.", "math": "w ≠ 0", "level": "EXACT CRITERION VARIABLE", "source": "MotionScorer draft · Eq. 9"}, {"titleZh": "沿同一个 w 同时量 signal、nuisance 与 ρ(w)", "titleEn": "Measure signal, nuisance, and ρ(w) along the same w", "ledeZh": "右侧三个 live meters 由当前金色方向实时计算：signal=|wᵀŝ_E|，nuisance=√(wᵀD̂_Ew)，ratio 是二者的平方比。", "ledeEn": "Three live meters are computed from the current gold direction: signal=|wᵀŝ_E|, nuisance=√(wᵀD̂_Ew), and their squared ratio.", "readZh": "w 旋转前，三个 meter、箭头角度与数值已经绑定到同一个 canonical calculation。", "readEn": "Before w rotates, all three meters, arrow angle, and numbers are already bound to one canonical calculation.", "whyZh": "criterion 不是找最大 variance，而是找每单位 residual cost 的最大 score-aligned signal。", "whyEn": "The criterion does not seek maximum variance; it seeks maximum score-aligned signal per unit residual cost.", "kidZh": "像比较“声音有多响”除以“背景噪声有多大”，而不是只追求总音量。", "kidEn": "Like comparing voice loudness against background noise rather than maximizing total volume.", "boundaryZh": "分子和分母都对 w 二次齐次，因此全局缩放 w 不会作弊。", "boundaryEn": "The numerator and denominator are both quadratic in w, so globally scaling w cannot game the criterion.", "math": "ρ(w)=(wᵀŝ_E)²/(wᵀD̂_Ew)", "level": "EXACT CRITERION", "source": "MotionScorer draft · Eq. 9 / Remark 1"}, {"titleZh": "旋转同一根 w：三维方向与 angle→deflection 曲线联动", "titleEn": "Rotate the same w: 3D direction and angle→deflection curve move together", "ledeZh": "金色 ruler 在一个教学性二维旋转 slice 中扫过；右下曲线上的点与三维角度同步，signal、nuisance、ρ meters 同时更新。", "ledeEn": "The gold ruler sweeps through a pedagogical 2D rotation slice; the point on the lower-right curve synchronizes with the 3D angle, while all meters update.", "readZh": "曲线峰值对应当前 slice 中最清楚的读取方向；低谷表示 signal 小或 nuisance 大。", "readEn": "Curve peaks correspond to clear reading directions in the current slice; valleys indicate weak signal or large nuisance.", "whyZh": "这恢复了“方向怎样影响 criterion”的过程，而不是只给最终箭头。", "whyEn": "This restores the process of how direction affects the criterion rather than showing only the final arrow.", "kidZh": "像转动收音机天线，仪表曲线现场显示哪个角度最清楚。", "kidEn": "Like rotating a radio antenna while a live curve shows which angle is clearest.", "boundaryZh": "曲线只表示当前二维 slice 的 ρ(w(θ))，不是完整高维 sphere 上的函数图。", "boundaryEn": "The curve shows ρ(w(θ)) only on the current 2D slice, not the full high-dimensional sphere.", "math": "θ ↦ ρ(w(θ))", "level": "SCHEMATIC SLICE OF EXACT CRITERION", "source": "MotionScorer draft · Fig. 3 / Eq. 9"}, {"titleZh": "闭式最佳方向出现：w* ∝ D̂_E⁻¹ ŝ_E", "titleEn": "The closed-form best direction appears: w* ∝ D̂_E⁻¹ ŝ_E", "ledeZh": "旋转停止在金色 w*。它在高噪声轴上缩短、在低噪声且 score-aligned 的方向上伸长。", "ledeEn": "Rotation stops at gold w*. It shrinks along high-noise axes and extends along low-noise, score-aligned directions.", "readZh": "curve marker 停在最大值；三个 meters 给出当前 canonical batch 的精确 ratio。", "readEn": "The curve marker stops at its maximum; the three meters report the exact ratio for the canonical batch.", "whyZh": "白化 nuisance 再对齐 signal 的 classical logic 在 latent coordinates 中得到闭式解。", "whyEn": "The classical logic of whitening nuisance before aligning with signal yields a closed form in latent coordinates.", "kidZh": "像先把各方向背景音量调平，再直接朝最清楚的声音方向转。", "kidEn": "Like equalizing background noise across directions and then turning toward the clearest voice.", "boundaryZh": "闭式最大值对给定 ŝ_E、D̂_E 是精确的；它不保证共享 query readout 一定因此改善。", "boundaryEn": "The closed-form maximum is exact for given ŝ_E and D̂_E; it does not guarantee that the shared-query readout must improve.", "math": "w* ∝ D̂_E⁻¹ ŝ_E", "level": "EXACT CRITERION", "source": "MotionScorer draft · Eq. 9 / Algorithm 2"}, {"titleZh": "whitening：同一 residual samples 只做轴缩放，ellipsoid 变成球", "titleEn": "Whitening: the same residual samples undergo axis scaling only, turning the ellipsoid into a sphere", "ledeZh": "每个 residual point 沿 z₁、z₂、z₃ 以 D̂_E⁻¹ᐟ² 缩放。sample IDs、点间对应与原点都保持；没有额外旋转或换点。", "ledeEn": "Every residual point scales along z₁, z₂, and z₃ by D̂_E⁻¹ᐟ². Sample IDs, correspondences, and origin remain; no extra rotation or replacement occurs.", "readZh": "红色 ellipsoid 连续变球，绿色 ŝ_E 同步变成 whitened signal D̂_E⁻¹ᐟ²ŝ_E。", "readEn": "The red ellipsoid continuously becomes a sphere while green ŝ_E becomes the whitened signal D̂_E⁻¹ᐟ²ŝ_E.", "whyZh": "在 whitened 坐标里所有方向的 residual cost 相同，问题只剩 signal 哪边最长。", "whyEn": "In whitened coordinates, residual cost is equal in every direction, leaving only which direction has the longest signal.", "kidZh": "像把不同方向的噪声刻度先校准成同一单位。", "kidEn": "Like calibrating noise scales in every direction to the same unit.", "boundaryZh": "这一画面对应 diagonal approximation；full covariance whitening 还会包含旋转。", "boundaryEn": "This visual corresponds to the diagonal approximation; full-covariance whitening would also rotate.", "math": "r_b ↦ D̂_E⁻¹ᐟ² r_b", "level": "EXACT TRANSFORM FOR STATED APPROXIMATION", "source": "MotionScorer draft · Eq. 9 / App. D"}, {"titleZh": "三种读法定格为同一个 closed-form maximum", "titleEn": "Three readings freeze into the same closed-form maximum", "ledeZh": "原坐标中的 signal²/nuisance、whitened signal norm 与最佳方向 w* 三者被并排写出，所有数值来自同一 canonical batch。", "ledeEn": "Signal²/nuisance in original coordinates, whitened-signal norm, and best direction w* are written side by side, all from the same canonical batch.", "readZh": "画面保留 whitened sphere、green vector 与 gold w*，不切换到新图。", "readEn": "The whitened sphere, green vector, and gold w* remain; no new diagram replaces them.", "whyZh": "这让 Eq. 9 不再只是一个孤立公式，而是前面 movement 的终点。", "whyEn": "This makes Eq. 9 the endpoint of the preceding movements rather than an isolated formula.", "kidZh": "像同一座山可以用“最高点”“最陡方向”或“高度数值”三种方式描述。", "kidEn": "Like describing the same mountain by its summit, steepest direction, or height value.", "boundaryZh": "criterion 对 global rescaling of z_E 不变；label permutation control 仍必须排除 target-agnostic variance shaping。", "boundaryEn": "The criterion is invariant to global rescaling of z_E; the label-permutation control is still required to rule out target-agnostic variance shaping.", "math": "ρ_TCD = max_w ρ(w) = ŝ_EᵀD̂_E⁻¹ŝ_E = ‖D̂_E⁻¹ᐟ²ŝ_E‖²", "level": "EXACT CRITERION", "source": "MotionScorer draft · Eq. 9 / Remark 1"}, {"titleZh": "经典 filtering 对象与可估计 latent 对象逐项对齐", "titleEn": "Align classical filtering objects with estimable latent objects term by term", "ledeZh": "下方左右分区：左侧保留 θ、Σ、free tap direction α；右侧保留 ŝ_E、D̂_E、latent direction w。三条彩色箭头逐项连接。", "ledeEn": "The lower region splits left/right: θ, Σ, and free tap direction α remain on the left; ŝ_E, D̂_E, and latent direction w remain on the right. Three colored arrows connect corresponding roles.", "readZh": "coordinate substitution 不会把 w 误画成 attention taps，也不会把 classical optimum 直接写进 Φ。", "readEn": "The coordinate substitution never depicts w as attention taps or writes the classical optimum directly into Φ.", "whyZh": "Algorithm 2 不是任意发明一个 regularizer，而是在可估计 latent coordinates 中执行 deflection criterion。", "whyEn": "Algorithm 2 is not an arbitrary regularizer; it executes the deflection criterion in estimable latent coordinates.", "kidZh": "像把旧地图上的“信号、噪声、方向”翻译成新地图上的三个对应词，但不把两张地图说成同一张。", "kidEn": "Like translating signal, noise, and direction between two maps without claiming the maps are identical.", "boundaryZh": "这是 criterion-role substitution；不继承 classical realized-tap optimality guarantee。", "boundaryEn": "This is a criterion-role substitution and does not inherit the classical realized-tap optimality guarantee.", "math": "(θ,Σ,α) ↦ (ŝ_E,D̂_E,w)", "level": "EXACT ALGEBRA + SCIENTIFIC BOUNDARY", "source": "MotionScorer draft · Sec. 4.3 / App. C.1"}, {"titleZh": "detail 收回 z_E：梯度经 z_E→E 间接改变可实现 taps", "titleEn": "Close the detail into z_E: gradients change realizable taps indirectly through z_E→E", "ledeZh": "三维 laboratory 收缩回上方 z_E card；金色梯度沿 ρ_TCD→z_E→E→αΦ(E) 返回 3D filter。free tap sliders 始终锁住。", "ledeEn": "The 3D laboratory retracts into the upper z_E card; a gold gradient returns along ρ_TCD→z_E→E→αΦ(E). Free tap sliders remain locked.", "readZh": "终态重新看到完整 hierarchy，latent detail 没有留成孤立 appendix 图。", "readEn": "The terminal state restores the full hierarchy; the latent detail does not remain an isolated appendix figure.", "whyZh": "TCD 选择的是 shared query 在 AΦ 内的移动方向，而不是直接赋值每个 attention tap。", "whyEn": "TCD selects how the shared query moves within AΦ rather than assigning each attention tap directly.", "kidZh": "像清晰度仪表只能推动联动手柄，不能伸手逐个拧八只旋钮。", "kidEn": "Like a clarity meter that can push only the coupled handle, not reach out to turn eight knobs independently.", "boundaryZh": "criterion benefit 是 empirical method claim；若 ρ 上升但 held-out 不改善，filtering 只能保留为解释视角。", "boundaryEn": "Criterion benefit is an empirical method claim; if ρ rises without held-out improvement, filtering remains only an interpretive view.", "math": "∇_E ρ_TCD : ρ → z_E → E → αΦ(E)", "level": "METHOD UPDATE PATH", "source": "MotionScorer draft · Eq. 10 / App. D.2"}], "handoffIn": "filtered-latent-orb", "handoffOut": "training-graph"}, {"chapterZh": "07 · 训练、撤架、证据与边界", "chapterEn": "07 · Training, scaffold removal, evidence, and scope", "mother": "training-evidence", "height": "1480vh", "beats": [{"titleZh": "上方完整链条保留；下方分成 reporting 与 selection 两支", "titleEn": "Retain the full chain above; split below into reporting and selection branches", "ledeZh": "左支从完整 score-query state h_s 经 scalar head 输出 ŷ；右支只从 exact context-attention latent z_E 计算 TCD。两支在 shared E 汇合。", "ledeEn": "The left branch reads full score-query state h_s through a scalar head to output ŷ; the right branch computes TCD only from the exact context-attention latent z_E. Both meet at shared E.", "readZh": "沿颜色读到底：蓝/橙支负责报分，绿/金支负责选择读法。", "readEn": "Follow colors to the end: blue/orange reports the score, green/gold selects the reading.", "whyZh": "这避免把 full h_s 错画成线性 filter，也避免让 TCD 直接承担最终报告。", "whyEn": "This prevents mislabeling full h_s as a linear filter or making TCD directly report the final score.", "kidZh": "像一条线路负责报成绩，另一条线路检查读题方法；两者共用学生。", "kidEn": "Like one circuit reporting the grade while another inspects the reading method; both share the same student.", "boundaryZh": "full-state criterion 是论文预注册 control；若与 exact branch 表现相同，filter identity 的算法价值需降级。", "boundaryEn": "A full-state criterion is a preregistered control; if it performs identically, the algorithmic value of the filter identity must be downgr
