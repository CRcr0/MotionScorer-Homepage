aded.", "math": "h_s → g_ω → ŷ  |  z_E → ρ_TCD", "level": "EXACT BRANCHING", "source": "MotionScorer draft · Sec. 4 / Fig. 7"}, {"titleZh": "总目标只更新 E 与 ω，冻结 Φ 从头到尾不动", "titleEn": "The total objective updates only E and ω while Φ remains frozen throughout", "ledeZh": "L_score 把最终答案拉向 y*；−λρ_TCD 把共享读法推向更高 clarity。两条梯度只在蓝色组件上发热。", "ledeEn": "L_score pulls the final answer toward y*; −λρ_TCD pushes the shared reading toward higher clarity. Both gradients heat only the blue components.", "readZh": "上方场景、VLM、context states 与 values 保持同一颜色和 checksum。", "readEn": "Scene, VLM, context states, and values above retain the same color and checksum.", "whyZh": "方法的核心不是多一个大模型，而是在 frozen interface 上增加一个小型 selection principle。", "whyEn": "The method’s core is not another large model but a small selection principle on the frozen interface.", "kidZh": "像只训练读卡器和指针，不拆开封条重焊整台机器。", "kidEn": "Like training only the card reader and pointer without breaking the seal and rewiring the whole machine.", "boundaryZh": "TCD 的方法主张需由 matched supervision/capacity/budget 下的 held-out improvement 支持。", "boundaryEn": "The TCD method claim requires held-out improvement under matched supervision, capacity, and budget.", "math": "J = L_score − λρ_TCD;  update (E,ω) only", "level": "METHOD", "source": "MotionScorer draft · Alg. 1 / Eq. 10"}, {"titleZh": "只切换一个项：λ=0 是 plain readout，λ>0 才加入 how-to-read 选择", "titleEn": "Change one term only: λ=0 is the plain readout; λ>0 adds how-to-read selection", "ledeZh": "两侧共享同一 frozen checkpoint、pseudo labels、query count、scalar-head capacity、optimizer 与训练预算。唯一算法差异是 −λρ_TCD。", "ledeEn": "Both sides share the frozen checkpoint, pseudo labels, query count, scalar-head capacity, optimizer, and training budget. The only algorithmic difference is −λρ_TCD.", "readZh": "左侧 λ=0 只检查最后答案；右侧 λ>0 在相同 score loss 上增加金色内部选择路径。上方 Φ、E 接口与输入保持不变。", "readEn": "The left λ=0 checks only the final answer; the right λ>0 adds a gold internal-selection path to the same score loss. The upper Φ, E interface, and input remain fixed.", "whyZh": "这一拍把 plain readout 与 nuGuidance 的因果差异从最终表格提前定位到 objective 本身。", "whyEn": "This beat locates the causal difference between the plain readout and nuGuidance in the objective itself before showing final tables.", "kidZh": "像两位学生使用同一本书、同一支笔；第二位多了一条“必须引用可靠证据”的阅卷规则。", "kidEn": "Like two students using the same book and pen, while the second receives one extra grading rule: cite reliable evidence.", "boundaryZh": "两侧 tap 形状是机制示意；实际 matched-fit 与 held-out 差异在后续 Table 3 beat 中给出。λ 的有效区间需要实验 sweep，不主张越大越好。", "boundaryEn": "The two tap patterns are mechanistic illustrations; actual matched-fit and held-out differences appear later from Table 3. λ requires an empirical sweep and is not claimed to be better when arbitrarily larger.", "math": "λ=0: J=L_score   |   λ>0: J=L_score−λρ_TCD", "level": "MATCHED ALGORITHMIC CONTRAST", "source": "MotionScorer draft · Eq. 10 / App. I.6 / Table 3"}, {"titleZh": "训练结束后，teacher、规则执行与三维实验台全部撤下", "titleEn": "After training, teacher, rule execution, and the 3D laboratory are removed", "ledeZh": "橙色 teacher cache、金色 whitening statistics 与红色规则执行向下收起；部署只保留一次 frozen forward、shared query 与 scalar head。", "ledeEn": "The orange teacher cache, gold whitening statistics, and red rule execution retract; deployment keeps one frozen forward, shared queries, and a scalar head.", "readZh": "看终态：推理路径上没有 teacher call、batch covariance 或规则表。", "readEn": "At the terminal state, the inference path contains no teacher call, batch covariance, or rule table.", "whyZh": "训练脚手架解决选择问题，但不成为部署时的持续成本。", "whyEn": "Training scaffolding solves the selection problem without becoming a recurring deployment cost.", "kidZh": "像施工时用脚手架校正楼体，完工后脚手架被拆走。", "kidEn": "Like using scaffolding to align a building and removing it after construction.", "boundaryZh": "teacher 是一次性 offline labeling；论文还要求单独报告该成本，而不把它藏进推理 latency。", "boundaryEn": "The teacher is a one-time offline labeler; the paper requires its cost to be reported separately rather than hidden in inference latency.", "math": "deployment: (x,τ) → frozen Φ + E + g_ω → ŷ", "level": "EXACT DEPLOYMENT", "source": "MotionScorer draft · App. D.1 / Fig. 7"}, {"titleZh": "native channel 的真实 aggregate 差距：准确率、分数层级与稳定性一起看", "titleEn": "The native-channel aggregate gap: alignment, score levels, and stability together", "ledeZh": "三个指标卡使用论文的固定 prompting controls：PairAcc、effective score levels 与 prompt sensitivity。learned query readout 在同一 frozen backbone 上同时改善三项。", "ledeEn": "Three metric cards use the paper’s fixed prompting controls: PairAcc, effective score levels, and prompt sensitivity. The learned query readout improves all three on the same frozen backbone.", "readZh": "每个卡片把 Prompt、Plain 与 Ours 放在同一尺度；不会用不同纵轴夸大差异。", "readEn": "Each card places Prompt, Plain, and Ours on one scale; separate axes are not used to exaggerate differences.", "whyZh": "这把 background 的 schematic round bins 落到真实 aggregate measurements。", "whyEn": "This grounds the background’s schematic round bins in actual aggregate measurements.", "kidZh": "像不仅看答对率，还看学生是否只能说几个固定答案，以及换问法是否就变。", "kidEn": "Like measuring not only correctness but also whether a student uses only a few stock answers and changes under paraphrase.", "boundaryZh": "Prompt row是 strongest prompting control；PairAcc 57.6、levels 23.7、sensitivity 0.62 来自论文 Sec. 5.3。", "boundaryEn": "The Prompt row is the strongest prompting control; PairAcc 57.6, levels 23.7, and sensitivity 0.62 come from Sec. 5.3.", "math": "Prompt: 57.6 / 23.7 / 0.62  ·  Plain: 66.8 / 287 / 0.11  ·  Ours: 70.3 / 341 / 0.09", "level": "EMPIRICAL RESULT", "source": "MotionScorer draft · Fig. 4 / Sec. 5.3"}, {"titleZh": "同一 backbone 上，learned query interface 大幅缩小 prompt 缺口", "titleEn": "On the same backbone, the learned query interface greatly narrows the prompt gap", "ledeZh": "WOD-E2E pairwise accuracy 从 direct prompting 的 54.2 提升到 plain readout 的 66.8，再到 nuGuidance 的 70.3；同 backbone LoRA 为 71.5。", "ledeEn": "WOD-E2E pairwise accuracy rises from 54.2 for direct prompting to 66.8 for the plain readout and 70.3 for nuGuidance; same-backbone LoRA reaches 71.5.", "readZh": "前三根柱都标明 Φ frozen；只有 LoRA 柱标明 backbone weights updated。", "readEn": "The first three towers are marked Φ frozen; only the LoRA tower is marked backbone weights updated.", "whyZh": "大部分 human-aligned scoring gap 可以通过 frozen query interface 恢复，而不必重写主干。", "whyEn": "Most of the human-aligned scoring gap can be recovered through the frozen query interface without rewriting the backbone.", "kidZh": "像换一个更好的读表方式，就接近拆机重调后的效果。", "kidEn": "Like approaching the result of machine retuning by replacing only the way the meter is read.", "boundaryZh": "这些是论文当前 draft 的实证数字；它们依赖对应 benchmark protocol 与五个随机 seed。", "boundaryEn": "These are empirical numbers in the current draft and depend on the stated benchmark protocol and five random seeds.", "math": "54.2 → 66.8 → 70.3  (LoRA 71.5)", "level": "EMPIRICAL RESULT", "source": "MotionScorer draft · Table 2"}, {"titleZh": "决定性对照：teacher fit 几乎一样，held-out 读出却更好", "titleEn": "Decisive comparison: teacher fit is nearly identical, but held-out reading is better", "ledeZh": "plain 与 nuGuidance 的 pseudo RMSE 为 0.096 vs 0.095，SRCC 为 0.888 vs 0.891；WOD PairAcc 却为 66.8 vs 70.3，held-out ρ 为 6.4 vs 8.7。", "ledeEn": "Plain and nuGuidance have pseudo RMSE 0.096 vs 0.095 and SRCC 0.888 vs 0.891, yet WOD PairAcc is 66.8 vs 70.3 and held-out ρ is 6.4 vs 8.7.", "readZh": "先看上方 teacher-fit 柱几乎等高，再看下方 external generalization 与 clarity 同向上升。", "readEn": "First verify nearly equal teacher-fit bars above, then read external generalization and clarity rising together below.", "whyZh": "这直接检验“what 相同，how 不同”，而不是简单证明“加一个 loss 数字就更高”。", "whyEn": "This directly tests “same what, different how” rather than merely showing that adding a loss improves a number.", "kidZh": "像两人平时作业分数几乎一样，陌生考试与解题过程才一起拉开差距。", "kidEn": "Like two students with nearly identical homework scores whose novel-exam performance and reasoning quality diverge together.", "boundaryZh": "若 ρ 上升却没有 external held-out benefit，或 permutation control 同样提升，filtering 只能保留为解释镜头。", "boundaryEn": "If ρ rises without external held-out benefit, or permutation control gains similarly, filtering remains only an interpretive lens.", "math": "matched pseudo fit  ·  better held-out reading", "level": "EMPIRICAL RESULT", "source": "MotionScorer draft · Table 3 / registered prediction"}, {"titleZh": "直接干预同一 attention branch：破坏学到的 taps 会显著掉分", "titleEn": "Intervene on the same attention branch: damaging learned taps causes a large drop", "ledeZh": "在同一 trained checkpoint 与 scalar head 上执行 uniform、top-mass suppression、equal-mass random suppression 与 within-modality shuffle；不进行 retraining。", "ledeEn": "Uniformization, top-mass suppression, equal-mass random suppression, and within-modality shuffling are applied to one trained checkpoint and scalar head, with no retraining.", "readZh": "上方保留 learned Lane…Red taps；下方每个 intervention 同时显示 ΔPairAcc 与 held-out ρ_TCD。", "readEn": "The learned Lane…Red taps remain above; each intervention below shows both ΔPairAcc and held-out ρ_TCD.", "whyZh": "top-attended suppression 远大于 equal-mass random suppression，提供 attention pattern 具有功能作用的因果证据。", "whyEn": "Top-attended suppression hurts far more than equal-mass random suppression, giving causal evidence that the attention pattern is functional.", "kidZh": "像拔掉收音机真正接收信号的天线比随机剪掉同样长的无关电线更严重。", "kidEn": "Like removing the radio antenna carrying the signal being much worse than cutting an equal length of random wire.", "boundaryZh": "intervention 只作用于 normalized context attention，并保持 queries、head、residual paths 与 backbone 固定。", "boundaryEn": "Interventions act only on normalized context attention while queries, head, residual paths, and backbone remain fixed.", "math": "ΔAcc: Uniform −9.4 · Top −8.5 · Random −1.4 · Shuffle −5.2", "level": "CAUSAL EMPIRICAL EVIDENCE", "source": "MotionScorer draft · Table 5 / App. I.7.3"}, {"titleZh": "轻量不是一句口号：把参数、训练成本、准确率与原能力放在同一账本", "titleEn": "Lightweight is measurable: put parameters, training cost, accuracy, and original ability on one ledger", "ledeZh": "nuGuidance、LoRA 与 full SFT 从匹配起点比较。V6 同时展示 trainable parameters、GPU-hours、WOD PairAcc 与 original-ability average change，避免只挑一个有利指标。", "ledeEn": "nuGuidance, LoRA, and full SFT are compared from matched starting points. V6 shows trainable parameters, GPU-hours, WOD PairAcc, and average original-ability change together rather than cherry-picking one favorable metric.", "readZh": "四个同步面板共用相同方法颜色；参数使用 log scale 但每个柱顶写出原始数值，能力变化以 0 为基线向下绘制。", "readEn": "Four synchronized panels use consistent method colors; parameter bars use a log scale with raw values printed above, and ability change is drawn downward from a zero baseline.", "whyZh": "冻结 readout 接近 LoRA/SFT 的评分准确率，同时只训练 0.04M 参数并结构性保留原任务能力。", "whyEn": "The frozen readout approaches LoRA/SFT scoring accuracy while training only 0.04M parameters and structurally preserving original abilities.", "kidZh": "像给机器加一个很小的读表头，而不是拆开整台机器重新焊接。", "kidEn": "Like attaching a tiny gauge reader instead of opening and rewiring the entire machine.", "boundaryZh": "这是论文 Table 8 的匹配实验结果；teacher 的一次性离线生成成本不计入 deployed inference，能力保持通过 checksums 与不附加 queries 的原任务评估验证。", "boundaryEn": "These are matched results from Table 8; one-time offline teacher generation is excluded from deployed inference, and ability preservation is verified by checksums and original-task evaluation without appended queries.", "math": "Ours: 0.04M / 23 GPU-h / 70.3 / Δ0.00†   ·   LoRA: 40.4M / 118 / 71.5 / Δ−1.7   ·   SFT: 8.29B / 760 / 72.4 / Δ−5.8", "level": "EMPIRICAL COST–ABILITY RESULT", "source": "MotionScorer draft · Table 8 / App. K.1"}, {"titleZh": "可靠 frozen readout 最终受两个 ceiling 限制", "titleEn": "Reliable frozen readout is ultimately capped by two ceilings", "ledeZh": "第一，冻结表示必须确实包含 trajectory-quality signal；第二，shared query interface 必须能够实现一个有效 readout。两道门缺一不可。", "ledeEn": "First, the frozen representation must contain trajectory-quality signal. Second, the shared query interface must be able to realize an effective readout. Both gates are necessary.", "readZh": "上方完整链条不再变化；下方两道门分别显示 representation ceiling 与 realizability ceiling。", "readEn": "The complete chain above stops changing; the two lower gates show the representation and realizability ceilings.", "whyZh": "MotionScorer 的主张是“读出已有能力”，不是凭空创造表示里不存在的信息。", "whyEn": "MotionScorer claims to read existing ability, not to create information absent from the representation.", "kidZh": "像仓库必须先有货，门和传送带也必须真的能把货送出来。", "kidEn": "Like needing both goods in the warehouse and a door/conveyor capable of delivering them.", "boundaryZh": "方法不保证 human alignment、attention 唯一性或 classical-optimal taps；这些边界在论文 scope 中明确保留。", "boundaryEn": "The method does not guarantee human alignment, unique attention, or classically optimal taps; these boundaries remain explicit in the paper’s scope.", "math": "representation ceiling  ∧  realizability ceiling", "level": "SCOPE", "source": "MotionScorer draft · Conclusion / App. O"}], "handoffIn": "training-graph", "handoffOut": "deployment-score"}]</script><script>(()=>{

const TAU=Math.PI*2;
const col={bg:'#031015',ink:'#f3fbfb',muted:'#91aab0',teal:'#55d8d2',sky:'#8fd0ff',blue:'#78a9ff',orange:'#ff9f55',red:'#ff6875',green:'#74e2ae',gold:'#ffd166',purple:'#bda2ff',gray:'#7b9298',white:'#eef7f7'};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,sm=t=>{t=clamp(t);return t*t*(3-2*t)},smo=t=>{t=clamp(t);return t*t*t*(t*(t*6-15)+10)},gate=(p,a,b)=>smo((p-a)/(b-a));

function rgba(c,a){if(c.startsWith('rgba'))return c;const n=parseInt(c.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function seeded(seed=1){let s=seed>>>0;return()=>{s=(1664525*s+1013904223)>>>0;return s/4294967296}}
const rnd=seeded(20270817);function normal(){const u=Math.max(1e-9,rnd()),v=Math.max(1e-9,rnd());return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v)}
const softmax=a=>{const m=Math.max(...a),e=a.map(v=>Math.exp(v-m)),s=e.reduce((x,y)=>x+y,0);return e.map(v=>v/s)};

const MODEL=(()=>{
  const N=64,xs=Array.from({length:N},(_,i)=>-3.25+6.5*i/(N-1));
  const quality=xs.map(x=>.54*Math.sin(1.35*x+.3)+.20*Math.sin(2.7*x-.5)+.82*Math.exp(-.5*((x-.72)/.48)**2)-.48*Math.exp(-.5*((x+1.55)/.42)**2));
  const channelDefs=[
    {nameZh:'质量证据 A',nameEn:'quality evidence A',kind:'signal',sig:1.05,noise:.15,phase:.2,c:col.green},
    {nameZh:'质量证据 B',nameEn:'quality evidence B',kind:'signal',sig:.78,noise:.22,phase:1.0,c:col.green},
    {nameZh:'格式干扰',nameEn:'format nuisance',kind:'noise',sig:.18,noise:1.05,phase:.7,c:col.red},

  const waves=channelDefs.map((d,k)=>xs.map((x,i)=>d.sig*quality[i]+d.noise*(.48*Math.sin(3.6*x+d.phase)+.25*Math.sin(7.2*x+.9*d.phase)+.12*Math.cos(11*x-k))));

})();
MODEL.tokenLabels=['Lane','Change','Congestion','Unnecessary','Follower','Brake','Road','Red'];

const CHECKS=(()=>{const a=MODEL.alphaStable.reduce((s,v)=>s+v,0),st=MODEL.stats,rec=Math.max(...st.zt.map((z,b)=>norm(vsub(z,vadd(vscale(st.s,st.yt[b]),st.res[b])))));const scaled=computeStats(MODEL.batch.map(q=>({y:q.y,z:vscale(q.z,3.7)})),1e-5,1e-3*3.7*3.7);return{alphaSum:a,reconstruction:rec,dPositive:Math.min(...st.D)>0,rhoScaleError:Math.abs(st.rho-scaled.rho)}})();

function resize(){DPR=Math.max(1,Math.min(2.5,devicePixelRatio||1));W=innerWidth;H=innerHeight;C.width=Math.round(W*DPR);C.height=Math.round(H*DPR);C.style.width=W+'px';C.style.height=H+'px';X.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function box(x,y,w,h,stroke=null,fill=null,r=10,lw=1,a=1){X.save();X.globalAlpha=a;X.beginPath();X.roundRect(x,y,w,h,r);if(fill){X.fillStyle=fill;X.fill()}if(stroke){X.strokeStyle=stroke;X.lineWidth=lw;X.stroke()}X.restore()}
function line(p,q,c=col.white,w=1.4,a=1,dash=null){X.save();X.globalAlpha=a;X.strokeStyle=c;X.lineWidth=w;X.lineCap='round';if(dash)X.setLineDash(dash);X.beginPath();X.moveTo(p.x,p.y);X.lineTo(q.x,q.y);X.stroke();X.restore()}

function visualRect(){if(W<=690)return{x:12,y:68,w:W-24,h:Math.max(300,H*.56-82)};if(W<=1100)return{x:25,y:82,w:W-50,h:H*.56-98};return{x:34,y:82,w:W*.615-48,h:H-116}}

/* 3D projection */
function rot3(p,yaw,pitch,roll=0){let[x,y,z]=p;let c=Math.cos(yaw),s=Math.sin(yaw);[x,z]=[c*x+s*z,-s*x+c*z];c=Math.cos(pitch);s=Math.sin(pitch);[y,z]=[c*y-s*z,s*y+c*z];c=Math.cos(roll);s=Math.sin(roll);[x,y]=[c*x-s*y,s*x+c*y];return[x,y,z]}

function roadScene(R,p){const b=Math.min(4,Math.floor(p*5)),q=p*5-b,u=reduceMotion?1:smo(q);const horizon=R.y+R.h*.24,roadTop=R.w*.16,roadBottom=R.w*.76,cx=R.x+R.w*.49;
